<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="かんたん家計簿">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<title>かんたん家計簿</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#fdfdfb; --surface2:#efeee8;
  --ink:#1c1a17; --ink2:#57534c; --muted:#8b877e;
  --line:#e4e2da; --line2:#d6d4ca;
  --accent:#0e7a63; --accent-hover:#0a6350; --accent-ink:#ffffff; --accent-soft:#e2f1ec;
  --income:#2a78d6; --expense:#d64c3a; --special:#8a5cc9; --special-chip:#f0e9fa;
  --good:#006300; --good-chip:#e3f2e3; --warn:#8a5a00; --warn-chip:#faf0d8;
  --crit:#b03030; --crit-chip:#f9e4e4; --info:#1c5cab; --info-chip:#e2edfb;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 1px 2px rgba(26,24,22,.05),0 4px 14px rgba(26,24,22,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121110; --surface:#1a1a19; --surface2:#232321;
    --ink:#f4f2ec; --ink2:#c3c2b7; --muted:#8f8d85;
    --line:#2c2c2a; --line2:#3a3a37;
    --accent:#3db894; --accent-hover:#59c9a8; --accent-ink:#0b241d; --accent-soft:#1d2f2a;
    --income:#4e90e6; --expense:#e66a58; --special:#ab84e0; --special-chip:#2b2138;
    --good:#4cc24c; --good-chip:#1d2e1d; --warn:#e5b04d; --warn-chip:#332b17;
    --crit:#e66767; --crit-chip:#341d1d; --info:#6da7ec; --info-chip:#1c2736;
    --grid:#2c2c2a; --axis:#383835;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="light"]{
  --bg:#f6f5f1; --surface:#fdfdfb; --surface2:#efeee8;
  --ink:#1c1a17; --ink2:#57534c; --muted:#8b877e;
  --line:#e4e2da; --line2:#d6d4ca;
  --accent:#0e7a63; --accent-hover:#0a6350; --accent-ink:#ffffff; --accent-soft:#e2f1ec;
  --income:#2a78d6; --expense:#d64c3a; --special:#8a5cc9; --special-chip:#f0e9fa;
  --good:#006300; --good-chip:#e3f2e3; --warn:#8a5a00; --warn-chip:#faf0d8;
  --crit:#b03030; --crit-chip:#f9e4e4; --info:#1c5cab; --info-chip:#e2edfb;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 1px 2px rgba(26,24,22,.05),0 4px 14px rgba(26,24,22,.06);
}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1a1a19; --surface2:#232321;
  --ink:#f4f2ec; --ink2:#c3c2b7; --muted:#8f8d85;
  --line:#2c2c2a; --line2:#3a3a37;
  --accent:#3db894; --accent-hover:#59c9a8; --accent-ink:#0b241d; --accent-soft:#1d2f2a;
  --income:#4e90e6; --expense:#e66a58; --special:#ab84e0; --special-chip:#2b2138;
  --good:#4cc24c; --good-chip:#1d2e1d; --warn:#e5b04d; --warn-chip:#332b17;
  --crit:#e66767; --crit-chip:#341d1d; --info:#6da7ec; --info-chip:#1c2736;
  --grid:#2c2c2a; --axis:#383835;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;min-height:100%;
  font-size:15px;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
header.app{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
  display:flex;align-items:baseline;gap:8px;
}
header.app h1{font-size:1.05rem;letter-spacing:.02em}
header.app .sub{color:var(--muted);font-size:.8rem}
main{max-width:640px;margin:0 auto;padding:4px 14px calc(84px + env(safe-area-inset-bottom))}
section.tab{display:none}
section.tab.active{display:block}
h2{font-size:.95rem;color:var(--ink2);margin:18px 2px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:.8rem}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pos{color:var(--income)} .neg{color:var(--expense)}
/* ===== bottom nav ===== */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:.66rem;color:var(--muted);padding:4px 0;border-radius:10px;
}
nav.tabs button .ic{font-size:1.25rem;line-height:1.2}
nav.tabs button.active{color:var(--accent);font-weight:600}
/* ===== segmented ===== */
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:9px;color:var(--ink2);font-size:.88rem;white-space:nowrap}
.seg button.active{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.seg.full{display:flex}.seg.full button{flex:1}
/* ===== chips ===== */
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--ink2);position:relative}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.special-on{background:var(--special-chip);border-color:var(--special);color:var(--special);font-weight:600}
.chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.badge{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px}
.badge.good{background:var(--good-chip);color:var(--good)}
.badge.warn{background:var(--warn-chip);color:var(--warn)}
.badge.crit{background:var(--crit-chip);color:var(--crit)}
.badge.info{background:var(--info-chip);color:var(--info)}
.badge.special{background:var(--special-chip);color:var(--special)}
/* ===== input tab ===== */
.quickrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.quickrow::-webkit-scrollbar{display:none}
.quickbtn{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:7px 12px;font-size:.85rem;box-shadow:var(--shadow)}
.quickbtn b{margin-left:4px}
.amtbox{text-align:right;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:8px 0}
.amtbox .expr{color:var(--muted);font-size:.9rem;min-height:1.2em;word-break:break-all}
.amtbox .total{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.amtbox.zero .total{color:var(--muted)}
.amtbox .total.income-c{color:var(--income)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.key{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  font-size:1.35rem;font-weight:600;padding:13px 0;box-shadow:var(--shadow);user-select:none}
.key:active{background:var(--surface2)}
.key.fn{background:var(--surface2);font-size:1.1rem;color:var(--ink2)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catbtn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 2px 7px;
  display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow)}
.catbtn .ic{font-size:1.5rem;line-height:1.3}
.catbtn .nm{font-size:.68rem;color:var(--ink2);white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}
.catbtn:active{background:var(--accent-soft);border-color:var(--accent)}
.memoline{width:100%;margin-top:2px}
/* ===== stats / bars ===== */
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.stat3 .v{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat3 .k{font-size:.72rem;color:var(--muted)}
.bar{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)}
.budgetrow{padding:7px 0;border-bottom:1px solid var(--line)}
.budgetrow:last-child{border-bottom:none}
/* ===== transaction list ===== */
.txrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.txrow:last-child{border-bottom:none}
.txrow .ic{font-size:1.25rem;flex:0 0 auto}
.txrow .body{flex:1;min-width:0}
.txrow .t1{font-size:.9rem;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.txrow .t1 .memo{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis}
.txrow .t2{font-size:.72rem;color:var(--muted)}
.txrow .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayhead{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);
  padding:8px 2px 2px;border-bottom:1px dashed var(--line)}
/* ===== month nav ===== */
.mnav{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 10px}
.mnav .lbl{font-weight:700;font-size:1rem;min-width:9em;text-align:center}
.mnav button{font-size:1.1rem;padding:4px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
/* ===== calendar ===== */
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:.7rem;color:var(--muted);font-weight:500;padding:4px 0}
.cal td{border:1px solid var(--line);height:52px;vertical-align:top;padding:2px 3px;font-size:.72rem;cursor:pointer}
.cal td .d{color:var(--ink2)}
.cal td .a{display:block;text-align:right;font-size:.68rem;color:var(--expense);font-variant-numeric:tabular-nums;margin-top:2px;word-break:break-all}
.cal td .ai{display:block;text-align:right;font-size:.68rem;color:var(--income);font-variant-numeric:tabular-nums}
.cal td.today .d{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 5px;font-weight:700}
.cal td.sel{background:var(--accent-soft)}
.cal td.blank{background:var(--surface2);cursor:default}
/* ===== charts / tables ===== */
.legend{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:3px 0}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.legend .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .pc{color:var(--muted);font-size:.75rem;width:3.4em;text-align:right}
.legend .am{font-variant-numeric:tabular-nums;font-weight:600}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.x{border-collapse:collapse;font-size:.78rem;white-space:nowrap}
table.x th,table.x td{border:1px solid var(--line);padding:4px 7px;text-align:right;font-variant-numeric:tabular-nums}
table.x th:first-child,table.x td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
table.x thead th{background:var(--surface2);position:sticky;top:0}
/* ===== settings lists ===== */
.slist{display:flex;flex-direction:column}
.slist .si{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.slist .si:last-child{border-bottom:none}
.slist .si .grow{flex:1;min-width:0}
.slist .si .nm{font-size:.92rem}
.slist .si .sub{font-size:.75rem;color:var(--muted)}
.iconbtn{padding:5px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:.85rem;color:var(--ink2)}
.iconbtn:active{background:var(--surface2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);
  border-radius:12px;padding:9px 16px;font-weight:600;font-size:.9rem}
.btn:active{background:var(--accent-hover)}
.btn.ghost{background:var(--surface);color:var(--ink2);border:1px solid var(--line2)}
.btn.danger{background:var(--crit-chip);color:var(--crit)}
.btn.wide{width:100%;margin-top:8px}
/* ===== modal ===== */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
#overlay.show{display:block}
#modal{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:41;display:none;
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--bg);
  border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
#modal.show{display:block}
#modal h3{font-size:1rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
#modal h3 button{font-size:1.2rem;color:var(--muted);padding:2px 8px}
.frm{display:flex;flex-direction:column;gap:10px}
.frm label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--ink2)}
.frm .hrow{display:flex;gap:8px}.frm .hrow>label{flex:1}
/* ===== toast ===== */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));
  z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:.86rem;
  display:none;align-items:center;gap:12px;max-width:92vw;box-shadow:var(--shadow)}
#toast.show{display:flex}
#toast button{color:var(--warn);font-weight:700;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:.85rem}
.flowbar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:8px 0 4px;background:var(--surface2)}
.flowbar i{display:block;height:100%}
.flowrow{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:3px 0}
.flowrow .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.flowrow .nm{flex:1;min-width:0}
.flowrow .am{font-variant-numeric:tabular-nums;font-weight:600}
.wkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.wkgrid .v{font-weight:700;font-variant-numeric:tabular-nums}
.wkgrid .k{font-size:.72rem;color:var(--muted)}
svg{display:block;max-width:100%}
</style>
</head>
<body>
<header class="app"><h1>📒 かんたん家計簿</h1><span class="sub" id="headSub"></span></header>
<main>
  <section class="tab" id="tab-input"></section>
  <section class="tab" id="tab-home"></section>
  <section class="tab" id="tab-history"></section>
  <section class="tab" id="tab-report"></section>
  <section class="tab" id="tab-settings"></section>
</main>
<nav class="tabs">
  <button data-act="tab" data-tab="input"><span class="ic">✏️</span>入力</button>
  <button data-act="tab" data-tab="home"><span class="ic">🏠</span>ホーム</button>
  <button data-act="tab" data-tab="history"><span class="ic">📅</span>履歴</button>
  <button data-act="tab" data-tab="report"><span class="ic">📊</span>レポート</button>
  <button data-act="tab" data-tab="settings"><span class="ic">⚙️</span>設定</button>
</nav>
<div id="overlay" data-act="modal-close"></div>
<div id="modal"></div>
<div id="toast"><span id="toastMsg"></span><button id="toastAct" style="display:none"></button></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
'use strict';
/* ================= data layer ================= */
const LS_KEY = 'kakeibo-data-v1';

function defaultCategories(){
  const ex = [
    ['食費','🍚'],['日用品','🧴'],['外食','🍽️'],['交通','🚃'],
    ['趣味・娯楽','🎮'],['衣服・美容','👕'],['医療','🏥'],['交際費','🎁'],
    ['住居','🏠'],['水道光熱','💡'],['通信','📱'],['保険','🛡️'],['その他','📦']
  ];
  const inc = [['給与','💰'],['賞与','🎉'],['その他収入','💴']];
  let o = 0;
  return ex.map(([name,icon]) => ({id:uid(), name, icon, type:'expense', budget:0, order:o++}))
    .concat(inc.map(([name,icon]) => ({id:uid(), name, icon, type:'income', budget:0, order:o++})));
}
function defaultBuckets(members){
  const b = [{id:uid(), name:'貯金', kind:'saving'}];
  for(const m of (members||[]).filter(m => m !== '共同'))
    b.push({id:uid(), name:m + 'のお小遣い', kind:'allowance'});
  return b;
}
function defaultData(){
  const members = ['夫','妻','共同'];
  return {
    v:2,
    settings:{ members, theme:'auto', startDay:1, lastMember:0, savingsInitial:0, lastAlloc:{} },
    categories: defaultCategories(),
    transactions: [],
    recurrings: [],
    quickEntries: [],
    goals: [],
    buckets: defaultBuckets(members),
    savingTxs: []
  };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultData();
    const d = JSON.parse(raw);
    const base = defaultData();
    d.settings = Object.assign(base.settings, d.settings||{});
    for(const k of ['categories','transactions','recurrings','quickEntries','goals','savingTxs'])
      if(!Array.isArray(d[k])) d[k] = (k==='categories') ? base.categories : [];
    if(!Array.isArray(d.buckets) || !d.buckets.length) d.buckets = defaultBuckets(d.settings.members);
    if((d.v||1) < 2){ // v1 -> v2: 貯金目標の積立を貯金台帳(savingTxs)へ移行
      for(const g of d.goals){
        for(const dep of (g.deposits||[]))
          d.savingTxs.push({id:dep.id||uid(), date:dep.date, amount:dep.amount, memo:dep.memo||'', goalId:g.id});
        delete g.deposits;
      }
    }
    d.v = 2;
    return d;
  }catch(e){ return defaultData(); }
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ================= helpers ================= */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function todayStr(){ return fmtDate(new Date()); }
function yen(n){ return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function signedYen(n){ return (n>=0?'+':'-') + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const WD = ['日','月','火','水','木','金','土'];
function mdLabel(dateStr){ const d = parseDate(dateStr); return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'; }

function catById(id){ return S.categories.find(c => c.id === id); }
function catsOf(type){ return S.categories.filter(c => c.type === type).sort((a,b) => a.order - b.order); }
function memberName(i){ return S.settings.members[i] || '?'; }

/* ---- budget month (startDay-aware) ---- */
function startDay(){ return Math.min(28, Math.max(1, S.settings.startDay || 1)); }
function monthKeyOf(dateStr){
  const d = parseDate(dateStr); const sd = startDay();
  let y = d.getFullYear(), m = d.getMonth();
  if(d.getDate() < sd){ m--; if(m < 0){ m = 11; y--; } }
  return y + '-' + pad(m+1);
}
function curMonthKey(){ return monthKeyOf(todayStr()); }
function monthRange(key){
  const [y,m] = key.split('-').map(Number); const sd = startDay();
  return [new Date(y, m-1, sd), new Date(y, m, sd)]; // [start, end)
}
function shiftMonth(key, delta){
  let [y,m] = key.split('-').map(Number); m += delta;
  while(m > 12){ m -= 12; y++; } while(m < 1){ m += 12; y--; }
  return y + '-' + pad(m);
}
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  if(startDay() === 1) return y + '年' + m + '月';
  const [s,e] = monthRange(key);
  const last = new Date(e.getTime() - 86400000);
  return y + '年' + m + '月度 (' + (s.getMonth()+1) + '/' + s.getDate() + '〜' + (last.getMonth()+1) + '/' + last.getDate() + ')';
}
function inMonth(dateStr, key){ return monthKeyOf(dateStr) === key; }
function txInMonth(key){ return S.transactions.filter(t => inMonth(t.date, key)); }
function txType(t){ const c = catById(t.categoryId); return c ? c.type : 'expense'; }

/* ---- aggregation ---- */
function sums(key){
  let income = 0, expense = 0, special = 0;
  for(const t of txInMonth(key)){
    if(txType(t) === 'income') income += t.amount;
    else if(t.special) special += t.amount;
    else expense += t.amount;
  }
  return { income, expense, special, net: income - expense - special };
}
function catExpense(key, catId, includeSpecial){
  let s = 0;
  for(const t of txInMonth(key))
    if(t.categoryId === catId && txType(t) === 'expense' && (includeSpecial || !t.special)) s += t.amount;
  return s;
}
function totalBudget(){ return catsOf('expense').reduce((s,c) => s + (c.budget||0), 0); }
function spentFor(catId, key){ return catExpense(key, catId, false); }
function pctBadge(cur, prev){
  if(prev <= 0) return '';
  const p = Math.round((cur - prev) / prev * 100);
  if(p === 0) return '<span class="badge info">先月±0%</span>';
  return p > 0
    ? '<span class="badge crit">先月比+' + p + '%</span>'
    : '<span class="badge good">先月比' + p + '%</span>';
}

/* ---- savings & allocation ---- */
function bucketById(id){ return S.buckets.find(b => b.id === id); }
function savingBucketIds(){ return new Set(S.buckets.filter(b => b.kind === 'saving').map(b => b.id)); }
function savingsBalance(untilDate){
  let s = S.settings.savingsInitial || 0;
  for(const t of S.savingTxs) if(!untilDate || t.date <= untilDate) s += t.amount;
  return s;
}
function goalById(id){ return S.goals.find(g => g.id === id); }
function goalSaved(g){ return S.savingTxs.filter(t => t.goalId === g.id).reduce((s,t) => s + t.amount, 0); }
function allocTotal(tx){ return (tx.alloc||[]).reduce((s,a) => s + a.amount, 0); }
function monthAlloc(key){ // {per: {bucketId: amount}, total}
  const per = {}; let total = 0;
  for(const t of txInMonth(key)) if(txType(t) === 'income')
    for(const a of (t.alloc||[])){ per[a.bucketId] = (per[a.bucketId]||0) + a.amount; total += a.amount; }
  return {per, total};
}
function syncAllocSavings(tx){ // 収入txの振り分け → 貯金台帳を作り直す(冪等)
  S.savingTxs = S.savingTxs.filter(st => st.txId !== tx.id);
  const sav = savingBucketIds();
  for(const a of (tx.alloc||[])) if(sav.has(a.bucketId) && a.amount > 0)
    S.savingTxs.push({id:uid(), date:tx.date, amount:a.amount,
      memo:(bucketById(a.bucketId)?.name || '貯金') + 'へ振り分け', txId:tx.id, goalId:a.goalId || undefined});
}
function applySplits(amount, splits){ // ルールを収入額に収まるようにclampしてallocへ
  let remain = amount; const alloc = [];
  for(const sp of (splits||[])){
    const amt = Math.min(sp.amount, remain);
    if(amt > 0){ alloc.push({bucketId:sp.bucketId, amount:amt, goalId:sp.goalId || undefined}); remain -= amt; }
  }
  return alloc;
}
function allocSummary(tx){ // 「貯金5万/夫のお小遣い2万/家計21万」の文字列
  if(!tx.alloc || !tx.alloc.length) return '';
  const parts = tx.alloc.map(a => (bucketById(a.bucketId)?.name || '?') + yen(a.amount));
  const rest = tx.amount - allocTotal(tx);
  if(rest > 0) parts.push('家計' + yen(rest));
  return parts.join(' / ');
}

/* ================= recurring engine ================= */
function occurrenceDate(y, m, day){ // m: 1-12
  const dim = new Date(y, m, 0).getDate();
  return y + '-' + pad(m) + '-' + pad(Math.min(day, dim));
}
function checkRecurrings(){
  const applied = [];
  const tstr = todayStr();
  for(const r of S.recurrings){
    if(!r.active) continue;
    let [y,m] = (r.lastApplied || r.createdMonth || tstr.slice(0,7)).split('-').map(Number);
    if(r.lastApplied){ m++; if(m > 12){ m = 1; y++; } }
    const [cy,cm] = [Number(tstr.slice(0,4)), Number(tstr.slice(5,7))];
    while(y < cy || (y === cy && m <= cm)){
      const od = occurrenceDate(y, m, r.dayOfMonth);
      if(od > tstr) break;
      if(!r.createdDate || od >= r.createdDate){
        const tx = { id:uid(), date:od, amount:r.amount, categoryId:r.categoryId,
          memberIndex:r.memberIndex, memo:r.name, special:false, recurringId:r.id };
        if(r.splits && r.splits.length && catById(r.categoryId)?.type === 'income'){
          const alloc = applySplits(r.amount, r.splits);
          if(alloc.length){ tx.alloc = alloc; }
        }
        S.transactions.push(tx);
        if(tx.alloc) syncAllocSavings(tx);
        applied.push(r.name + ' ' + yen(r.amount) + ' (' + mdLabel(od) + ')');
      }
      r.lastApplied = y + '-' + pad(m);
      m++; if(m > 12){ m = 1; y++; }
    }
  }
  if(applied.length) save();
  return applied;
}

let toastTimer = null, toastAction = null;
function toast(msg, actLabel, actFn){
  $('#toastMsg').textContent = msg;
  const b = $('#toastAct');
  if(actLabel){ b.textContent = actLabel; b.style.display=''; toastAction = actFn; }
  else { b.style.display='none'; toastAction = null; }
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 4500);
}

  if(toastAction) toastAction();
  $('#toast').classList.remove('show');
});

function keyPress(k){
  const parts = UI.expr.split('+');
  const last = parts[parts.length-1];
  if(k === 'back'){ UI.expr = UI.expr.slice(0, -1); }
  else if(k === 'clear'){ UI.expr = ''; }
  else if(k === 'plus'){ if(last !== '' && !UI.expr.endsWith('+')) UI.expr += '+'; }
  else if(k === 'eval'){ const t = exprTotal(UI.expr); UI.expr = t > 0 ? String(t) : ''; }
  else { // digit or 00
    if(last.length + k.length > 9) return;
    if(last === '0' && k !== '+') UI.expr = UI.expr.slice(0,-1) + k.replace(/^00$/,'0');
    else UI.expr += k;
  }
  renderInput();
}
function saveTx(catId){
  const amount = exprTotal(UI.expr);
  if(amount <= 0){ toast('金額を入力してください'); return; }
  const cat = catById(catId);
  const tx = { id:uid(), date:UI.date, amount, categoryId:catId, memberIndex:UI.member,
    memo:UI.memo.trim(), special: UI.mode==='expense' && UI.special };
  S.transactions.push(tx);
  S.settings.lastMember = UI.member;
  save();
  UI.lastTxId = tx.id;
  UI.expr = ''; UI.memo = ''; UI.special = false; UI.date = todayStr();
  let msg = (cat ? cat.icon + cat.name : '') + ' ' + yen(amount) + ' を記録しました';
  if(cat && cat.type === 'expense' && !tx.special && cat.budget > 0){
    const remain = cat.budget - spentFor(catId, monthKeyOf(tx.date));
    msg += remain >= 0 ? ` / ${cat.name}あと${yen(remain)}` : ` / ${cat.name}予算${yen(-remain)}超過!`;
  }
  if(cat && cat.type === 'income'){
    renderInput();
    toast(msg);
    if(S.buckets.length) openAllocSheet(tx.id);
    return;
  }
  toast(msg, '☆定番に登録', () => quickFromTx(tx.id));
  renderInput();
}
/* ---- 振り分けシート ---- */
function openAllocSheet(txId){
  const t = S.transactions.find(x => x.id === txId);
  if(!t || txType(t) !== 'income') return;
  // プリセット: 既存の振り分け > 前回値(lastAlloc)
  const cur = {};
  let preset = (t.alloc && t.alloc.length) ? t.alloc : ((S.settings.lastAlloc||{})[t.categoryId] || []);
  for(const a of applySplits(t.amount, preset)) cur[a.bucketId] = a;
  const goalOpts = sel => '<option value="">目標を選ばない</option>' +
    S.goals.map(g => `<option value="${g.id}" ${sel===g.id?'selected':''}>🎯 ${esc(g.name)}</option>`).join('');
  openModal('収入の振り分け', `
  <div class="small muted" style="margin-bottom:8px">${mdLabel(t.date)} ${esc(catById(t.categoryId)?.name||'')} <b style="color:var(--income)">${yen(t.amount)}</b> をどこに回しますか?残りは自動で家計(生活費)になります。</div>
  <form class="frm" id="allocForm">
    ${S.buckets.map(b => `
      <div class="hrow" style="align-items:flex-end">
        <label style="flex:1.2">${b.kind==='saving' ? '💰' : '👛'} ${esc(b.name)}
          <input type="number" min="0" inputmode="numeric" placeholder="0" data-alloc="${b.id}" value="${cur[b.id]?cur[b.id].amount:''}"></label>
        ${b.kind==='saving' && S.goals.length ? `<label style="flex:1">貯金の使い道(任意)
          <select data-goal="${b.id}">${goalOpts(cur[b.id]?.goalId)}</select></label>` : ''}
      </div>`).join('')}
    <div class="spread" style="background:var(--surface2);border-radius:10px;padding:8px 12px">
      <span>🏠 残り → 家計(生活費)</span><b id="allocRest" style="font-variant-numeric:tabular-nums"></b>
    </div>
    <button class="btn wide" type="submit">この内容で振り分ける</button>
    <button class="btn wide ghost" type="button" id="allocNone">振り分けない(全額家計へ)</button>
  </form>`);
  const upd = () => {
    let s = 0;
    $$('#allocForm [data-alloc]').forEach(i => s += Number(i.value)||0);
    const rest = t.amount - s;
    const el = $('#allocRest');
    el.textContent = yen(rest);
    el.style.color = rest < 0 ? 'var(--crit)' : '';
    return rest;
  };
  upd();
  $$('#allocForm [data-alloc]').forEach(i => i.addEventListener('input', upd));
  $('#allocForm').addEventListener('submit', e => {
    e.preventDefault();
    if(upd() < 0){ alert('振り分けの合計が収入額を超えています'); return; }
    const alloc = [];
    $$('#allocForm [data-alloc]').forEach(i => {
      const amount = Number(i.value)||0;
      if(amount > 0){
        const bId = i.dataset.alloc;
        const gSel = $(`#allocForm [data-goal="${bId}"]`);
        alloc.push({bucketId:bId, amount, goalId: gSel && gSel.value ? gSel.value : undefined});
      }
    });
    if(alloc.length){ t.alloc = alloc; S.settings.lastAlloc[t.categoryId] = alloc; }
    else delete t.alloc;
    syncAllocSavings(t);
    save(); closeModal(); render();
    toast(alloc.length ? '振り分けました: ' + allocSummary(t) : '全額を家計にしました');
  });
  $('#allocNone').addEventListener('click', () => {
    delete t.alloc; syncAllocSavings(t);
    save(); closeModal(); render(); toast('全額を家計にしました');
  });
}

function weekStart(d){ const x = new Date(d); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function rangeExpense(from, to){ // [from, to] inclusive date strings; normal expense only
  let s = 0;
  for(const t of S.transactions)
    if(t.date >= from && t.date <= to && txType(t)==='expense' && !t.special) s += t.amount;
  return s;
}

    $('#fMem').addEventListener('change', e => { UI.histMem = e.target.value; renderHistory(); });

      const q = $('#fQ'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); });

function renderCalendar(key){
  const [start, end] = monthRange(key);
  const tstr = todayStr();
  const perDay = {};
  for(const t of txInMonth(key)){
    const p = perDay[t.date] = perDay[t.date] || {ex:0, inc:0};
    if(txType(t) === 'income') p.inc += t.amount; else p.ex += t.amount;
  }
  let cells = '';
  for(let i = 0; i < start.getDay(); i++) cells += '<td class="blank"></td>';
  let col = start.getDay();
  const d = new Date(start);
  while(d < end){
    const ds = fmtDate(d);
    const p = perDay[ds];
    cells += `<td data-act="cal-day" data-date="${ds}" class="${ds===tstr?'today':''} ${UI.selDay===ds?'sel':''}">
      <span class="d">${d.getDate()}</span>
      ${p && p.ex ? `<span class="a">${p.ex.toLocaleString()}</span>` : ''}
      ${p && p.inc ? `<span class="ai">+${p.inc.toLocaleString()}</span>` : ''}</td>`;
    col++;
    if(col === 7){ cells += '</tr><tr>'; col = 0; }
    d.setDate(d.getDate()+1);
  }
  while(col > 0 && col < 7){ cells += '<td class="blank"></td>'; col++; }
  let dayDetail = '';
  if(UI.selDay && inMonth(UI.selDay, key)){
    const dayTx = S.transactions.filter(t => t.date === UI.selDay);
    dayDetail = `<div class="card"><b>${mdLabel(UI.selDay)}の記録</b>
      <div style="margin-top:4px">${dayTx.length ? dayTx.map(txRow).join('') : '<div class="empty">記録なし</div>'}</div></div>`;
  }
  return `<div class="card"><table class="cal">
    <thead><tr>${WD.map((w,i) => `<th style="${i===0?'color:var(--crit)':i===6?'color:var(--info)':''}">${w}</th>`).join('')}</tr></thead>
    <tbody><tr>${cells}</tr></tbody></table>
    <div class="small muted" style="margin-top:6px">日付をタップするとその日の明細が見られます</div></div>${dayDetail}`;
}

function openEditTx(id){
  const t = S.transactions.find(x => x.id === id);
  if(!t) return;
  const type = txType(t);
  openModal('記録の編集', `
  <form class="frm" id="editTxForm">
    <div class="hrow">
      <label>日付<input type="date" name="date" value="${t.date}" required></label>
      <label>金額<input type="number" name="amount" value="${t.amount}" min="1" inputmode="numeric" required></label>
    </div>
    <label>カテゴリ<select name="categoryId">
      ${catsOf(type).map(c => `<option value="${c.id}" ${c.id===t.categoryId?'selected':''}>${esc(c.icon)} ${esc(c.name)}</option>`).join('')}
    </select></label>
    <div class="hrow">
      <label>支払者<select name="memberIndex">
        ${S.settings.members.map((m,i) => `<option value="${i}" ${i===t.memberIndex?'selected':''}>${esc(m)}</option>`).join('')}
      </select></label>
      ${type === 'expense' ? `<label>特別費<select name="special">
        <option value="">いいえ</option><option value="1" ${t.special?'selected':''}>✨はい(予算と別枠)</option></select></label>` : ''}
    </div>
    <label>メモ<input name="memo" value="${esc(t.memo||'')}"></label>
    ${type === 'income' ? `<div class="small" style="background:var(--surface2);border-radius:10px;padding:8px 12px">
      振り分け: ${t.alloc && t.alloc.length ? esc(allocSummary(t)) : 'なし(全額家計)'}
      <button class="iconbtn" type="button" id="editAllocBtn" style="margin-left:6px">✏️ 変更</button></div>` : ''}
    <button class="btn wide" type="submit">保存</button>
    <button class="btn wide danger" type="button" id="delTxBtn">この記録を削除</button>
  </form>`);
  $('#editTxForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    t.date = f.get('date'); t.amount = Number(f.get('amount'));
    t.categoryId = f.get('categoryId'); t.memberIndex = Number(f.get('memberIndex'));
    t.special = type === 'expense' && !!f.get('special');
    t.memo = String(f.get('memo')||'').trim();
    if(type === 'income'){ // 金額変更で振り分けが超過しないようにclampし、台帳を同期
      const alloc = applySplits(t.amount, t.alloc||[]);
      if(alloc.length) t.alloc = alloc; else delete t.alloc;
      syncAllocSavings(t);
    }
    save(); closeModal(); render(); toast('更新しました');
  });
  if(type === 'income') $('#editAllocBtn').addEventListener('click', () => openAllocSheet(id));
  $('#delTxBtn').addEventListener('click', () => {
    if(!confirm('この記録を削除しますか?' + (t.alloc && t.alloc.length ? '\n(貯金への振り分けも取り消されます)' : ''))) return;
    S.transactions = S.transactions.filter(x => x.id !== id);
    S.savingTxs = S.savingTxs.filter(st => st.txId !== id);
    save(); closeModal(); render(); toast('削除しました');
  });
}

/* ================= render: report ================= */
const CHART_COLORS = ['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc948','#b07aa1','#ff9da7','#9c755f','#6b9ac4','#c76d7e','#8cd17d','#bab0ac'];
function polar(cx,cy,r,a){ return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
function arcPath(cx,cy,r0,r1,a0,a1){
  const large = (a1 - a0) > Math.PI ? 1 : 0;
  const [x0,y0] = polar(cx,cy,r1,a0), [x1,y1] = polar(cx,cy,r1,a1);
  const [x2,y2] = polar(cx,cy,r0,a1), [x3,y3] = polar(cx,cy,r0,a0);
  return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r1} ${r1} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}A${r0} ${r0} 0 ${large} 0 ${x3.toFixed(1)} ${y3.toFixed(1)}Z`;
}
function pieChart(items){ // items: [{name, icon, value}]
  const total = items.reduce((s,x) => s + x.value, 0);
  if(total <= 0) return '<div class="empty">この月の支出はありません</div>';
  let a = -Math.PI/2;
  let paths = '';
  items.forEach((it,i) => {
    const frac = it.value / total;
    let a1 = a + frac * Math.PI * 2;
    if(frac >= 0.999){ // full circle: draw two halves
      paths += `<path d="${arcPath(90,90,44,84,a,a+Math.PI)}" fill="${CHART_COLORS[i%CHART_COLORS.length]}"/>`;
      paths += `<path d="${arcPath(90,90,44,84,a+Math.PI,a+2*Math.PI-0.0001)}" fill="${CHART_COLORS[i%CHART_COLORS.length]}"/>`;
    } else {
      paths += `<path d="${arcPath(90,90,44,84,a,Math.max(a1, a+0.005))}" fill="${CHART_COLORS[i%CHART_COLORS.length]}"/>`;
    }
    a = a1;
  });
  const legend = items.map((it,i) => `<div class="li">
    <span class="sw" style="background:${CHART_COLORS[i%CHART_COLORS.length]}"></span>
    <span class="nm">${esc(it.icon)} ${esc(it.name)}</span>
    <span class="pc">${(it.value/total*100).toFixed(1)}%</span>
    <span class="am">${yen(it.value)}</span></div>`).join('');
  return `<div style="display:flex;justify-content:center"><svg viewBox="0 0 180 180" width="190" height="190">${paths}
    <text x="90" y="86" text-anchor="middle" font-size="11" fill="var(--muted)">支出合計</text>
    <text x="90" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${yen(total)}</text></svg></div>
    <div class="legend">${legend}</div>`;
}
function barChart12(endKey){
  const keys = [];
  for(let i = 11; i >= 0; i--) keys.push(shiftMonth(endKey, -i));
  const data = keys.map(k => { const s = sums(k); return {k, inc:s.income, ex:s.expense + s.special, net:s.net}; });
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.ex)));
  const W = 600, H = 190, plotH = 150, bw = 16, gap = W/12;
  let bars = '', labels = '';
  data.forEach((d,i) => {
    const x = i*gap + gap/2;
    const hi = d.inc/max*plotH, he = d.ex/max*plotH;
    bars += `<rect x="${x-bw-1}" y="${160-hi}" width="${bw}" height="${Math.max(hi,0.5)}" rx="2" fill="var(--income)"/>`;
    bars += `<rect x="${x+1}" y="${160-he}" width="${bw}" height="${Math.max(he,0.5)}" rx="2" fill="var(--expense)"/>`;
    const [ ,mm] = d.k.split('-');
    labels += `<text x="${x}" y="${H-14}" text-anchor="middle" font-size="10" fill="var(--muted)">${Number(mm)}月</text>`;
    labels += `<text x="${x}" y="${H-2}" text-anchor="middle" font-size="9" fill="${d.net>=0?'var(--income)':'var(--expense)'}">${d.net===0?'':(d.net>0?'+':'')+Math.round(d.net/1000)+'k'}</text>`;
  });
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:480px;width:100%">
    <line x1="0" y1="160" x2="${W}" y2="160" stroke="var(--axis)"/>${bars}${labels}</svg></div>
    <div class="small muted" style="text-align:center">■<span style="color:var(--income)">収入</span> ■<span style="color:var(--expense)">支出</span> ・下段は収支(千円)</div>`;
}

function savingsTrendChart(){
  const endKey = curMonthKey();
  const keys = [];
  for(let i = 11; i >= 0; i--) keys.push(shiftMonth(endKey, -i));
  const data = keys.map(k => {
    const [ , end] = monthRange(k);
    const last = fmtDate(new Date(end.getTime() - 86400000));
    return {k, v: savingsBalance(last)};
  });
  const max = Math.max(1, ...data.map(d => Math.abs(d.v)));
  const W = 600, H = 175, bw = 30, gap = W/12;
  let bars = '', labels = '';
  data.forEach((d,i) => {
    const x = i*gap + gap/2;
    const h = Math.abs(d.v)/max*130;
    bars += `<rect x="${x-bw/2}" y="${d.v>=0 ? 150-h : 150}" width="${bw}" height="${Math.max(h,0.5)}" rx="3" fill="${d.v>=0?'var(--accent)':'var(--crit)'}" opacity="${i===11?1:.55}"/>`;
    const [ ,mm] = d.k.split('-');
    labels += `<text x="${x}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${Number(mm)}月</text>`;
    if(i === 11 || i === 0) labels += `<text x="${x}" y="${Math.max(12, (d.v>=0?150-h:150) - 4)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink2)">${Math.round(d.v/10000)}万</text>`;
  });
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:480px;width:100%">
    <line x1="0" y1="150" x2="${W}" y2="150" stroke="var(--axis)"/>${bars}${labels}</svg></div>`;
}

function moveCat(id, dir){
  const list = S.categories.slice().sort((a,b) => a.order - b.order);
  const i = list.findIndex(c => c.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= list.length) return;
  const tmp = list[i].order; list[i].order = list[j].order; list[j].order = tmp;
  save(); renderSettings();
}
function delCat(id){
  const used = S.transactions.some(t => t.categoryId === id) ||
    S.recurrings.some(r => r.categoryId === id) || S.quickEntries.some(q => q.categoryId === id);
  if(used){ alert('このカテゴリは記録・定期取引・定番で使用中のため削除できません。先にそれらを変更してください。'); return; }
  if(!confirm('このカテゴリを削除しますか?')) return;
  S.categories = S.categories.filter(c => c.id !== id);
  save(); renderSettings(); toast('削除しました');
}

    <div id="recSplits" style="display:none">
      <div class="small" style="margin-bottom:6px"><b>振り分けルール</b>(任意) — 記帳時に自動で振り分けます。残りは家計に。</div>
      <div class="frm">
      ${S.buckets.map(b => { const sp = r && r.splits ? r.splits.find(x => x.bucketId === b.id) : null;
        return `<div class="hrow" style="align-items:flex-end">
        <label style="flex:1.2">${b.kind==='saving' ? '💰' : '👛'} ${esc(b.name)}
          <input type="number" min="0" inputmode="numeric" placeholder="0" data-split="${b.id}" value="${sp?sp.amount:''}"></label>
        ${b.kind==='saving' && S.goals.length ? `<label style="flex:1">使い道(任意)
          <select data-splitgoal="${b.id}"><option value="">目標を選ばない</option>
          ${S.goals.map(g => `<option value="${g.id}" ${sp&&sp.goalId===g.id?'selected':''}>🎯 ${esc(g.name)}</option>`).join('')}</select></label>` : ''}
        </div>`; }).join('')}
      </div>
    </div>
    <div class="small muted">今日以降の該当日に自動で記帳されます(アプリを開いたとき)。過去の分をさかのぼって計上したい場合は、履歴から手動で追加してください。</div>
    <button class="btn wide" type="submit">保存</button>
  </form>`);
  const updSplitVis = () => {
    const c = catById($('#recForm [name="categoryId"]').value);
    $('#recSplits').style.display = c && c.type === 'income' ? '' : 'none';
  };
  updSplitVis();
  $('#recForm [name="categoryId"]').addEventListener('change', updSplitVis);
  $('#recForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const splits = [];
    if(catById(f.get('categoryId'))?.type === 'income'){
      $$('#recForm [data-split]').forEach(i => {
        const amount = Number(i.value)||0;
        if(amount > 0){
          const bId = i.dataset.split;
          const gSel = $(`#recForm [data-splitgoal="${bId}"]`);
          splits.push({bucketId:bId, amount, goalId: gSel && gSel.value ? gSel.value : undefined});
        }
      });
      if(splits.reduce((s,x) => s + x.amount, 0) > Number(f.get('amount'))){
        alert('振り分けの合計が金額を超えています'); return;
      }
    }
    if(r){
      r.name = f.get('name').trim(); r.amount = Number(f.get('amount'));
      r.dayOfMonth = Number(f.get('day')); r.categoryId = f.get('categoryId');
      r.memberIndex = Number(f.get('memberIndex'));
      r.splits = splits;
    } else {
      S.recurrings.push({id:uid(), name:f.get('name').trim(), amount:Number(f.get('amount')),
        dayOfMonth:Number(f.get('day')), categoryId:f.get('categoryId'),
        memberIndex:Number(f.get('memberIndex')), active:true, splits,
        createdDate:todayStr(), createdMonth:todayStr().slice(0,7), lastApplied:null});
    }
    save();
    const applied = checkRecurrings();
    closeModal(); render();
    toast(applied.length ? '🔁 ' + applied.join(' / ') + ' を自動計上しました' : '保存しました');
  });
}
function openBucketForm(id){
  const b = id ? bucketById(id) : null;
  openModal(b ? '振り分け先の編集' : '振り分け先を追加', `
  <form class="frm" id="bucketForm">
    <label>名前<input name="name" value="${b?esc(b.name):''}" placeholder="例: 投資 / ${S.settings.members[0]||'夫'}のお小遣い" required></label>
    <label>種類<select name="kind">
      <option value="saving" ${b&&b.kind==='saving'?'selected':''}>💰 貯金(残高に反映される)</option>
      <option value="allowance" ${b&&b.kind==='allowance'?'selected':''}>👛 お小遣い・渡し切り(残高は追わない)</option>
    </select></label>
    <button class="btn wide" type="submit">保存</button>
  </form>`);
  $('#bucketForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    if(b){
      const wasSaving = b.kind === 'saving';
      b.name = f.get('name').trim(); b.kind = f.get('kind');
      if(wasSaving !== (b.kind === 'saving')) // 種類が変わったら振り分け由来の台帳を作り直す
        for(const t of S.transactions) if(t.alloc && t.alloc.some(a => a.bucketId === b.id)) syncAllocSavings(t);
    }
    else S.buckets.push({id:uid(), name:f.get('name').trim(), kind:f.get('kind')});
    save(); closeModal(); renderSettings(); toast('保存しました');
  });
}
function delBucket(id){
  const used = S.transactions.some(t => (t.alloc||[]).some(a => a.bucketId === id)) ||
    S.recurrings.some(r => (r.splits||[]).some(sp => sp.bucketId === id));
  if(used){ alert('この振り分け先は収入の振り分けや定期取引のルールで使用中のため削除できません。先にそれらを変更してください。'); return; }
  if(!confirm('この振り分け先を削除しますか?')) return;
  S.buckets = S.buckets.filter(b => b.id !== id);
  save(); renderSettings(); toast('削除しました');
}
function openMemberForm(i){
  const isNew = i == null;
  openModal(isNew ? 'メンバーを追加' : 'メンバー名の変更', `
  <form class="frm" id="memForm">
    <label>名前<input name="name" value="${isNew?'':esc(S.settings.members[i])}" required maxlength="10"></label>
    <button class="btn wide" type="submit">保存</button>
  </form>`);
  $('#memForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = new FormData(e.target).get('name').trim();
    if(isNew) S.settings.members.push(name);
    else S.settings.members[i] = name;
    save(); closeModal(); renderSettings(); toast('保存しました');
  });
}
function delMember(i){
  if(S.settings.members.length <= 1) return;
  if(!confirm(`「${S.settings.members[i]}」を削除しますか?\nこのメンバーの記録は先頭のメンバーに付け替えられます。`)) return;
  for(const t of S.transactions){
    if(t.memberIndex === i) t.memberIndex = 0;
    else if(t.memberIndex > i) t.memberIndex--;
  }
  for(const arr of [S.recurrings, S.quickEntries]) for(const x of arr){
    if(x.memberIndex === i) x.memberIndex = 0;
    else if(x.memberIndex > i) x.memberIndex--;
  }
  S.settings.members.splice(i,1);
  if(S.settings.lastMember >= S.settings.members.length) S.settings.lastMember = 0;
  if(UI.member >= S.settings.members.length) UI.member = 0;
  save(); renderSettings(); toast('削除しました');
}
/* ---- backup / sample / wipe ---- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kakeibo-backup-' + todayStr().replace(/-/g,'') + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('バックアップを書き出しました');
}
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if(!d || !Array.isArray(d.transactions) || !Array.isArray(d.categories)) throw new Error('bad');
      if(!confirm(`バックアップを読み込みますか?\n(記録${d.transactions.length}件。現在のデータは上書きされます)`)) return;
      localStorage.setItem(LS_KEY, JSON.stringify(d));
      S = load(); save(); // v1バックアップはここでv2に移行して永続化
      applyTheme();
      UI.histMonth = curMonthKey(); UI.repMonth = curMonthKey();
      render(); toast('読み込みました');
    }catch(err){ alert('ファイルを読み込めませんでした。かんたん家計簿のバックアップJSONを選んでください。'); }
  };
  reader.readAsText(file);
});
function loadSample(){
  if(!confirm('サンプルデータを投入しますか?(現在のデータは上書きされます)')) return;
  S = defaultData();
  const cat = name => S.categories.find(c => c.name === name);
  const budgets = {'食費':40000,'日用品':10000,'外食':15000,'交通':10000,'趣味・娯楽':15000,'衣服・美容':10000,'水道光熱':15000,'通信':8000,'住居':85000};
  for(const [n,b] of Object.entries(budgets)){ const c = cat(n); if(c) c.budget = b; }
  S.settings.members = ['夫','妻','共同'];
  S.settings.savingsInitial = 500000;
  const savB = S.buckets.find(b => b.kind === 'saving');
  const alwB = S.buckets.filter(b => b.kind === 'allowance');
  const goal = {id:uid(), name:'沖縄旅行', targetAmount:200000};
  S.goals = [goal];
  const key = curMonthKey();
  const months = [shiftMonth(key,-2), shiftMonth(key,-1), key];
  const tstr = todayStr();
  const push = (date, amount, catName, member, memo, special, recurringId) => {
    if(date > tstr) return;
    S.transactions.push({id:uid(), date, amount, categoryId:cat(catName).id, memberIndex:member, memo:memo||'', special:!!special, recurringId});
  };
  months.forEach((mk, mi) => {
    const [start, end] = monthRange(mk);
    const dstr = d => fmtDate(d);
    // fixed
    push(dstr(start), 85000, '住居', 2, '家賃');
    const d10 = new Date(start); d10.setDate(d10.getDate()+9);
    push(dstr(d10), 11000 + mi*800, '水道光熱', 2, '電気・ガス');
    push(dstr(d10), 7500, '通信', 2, 'スマホ2台');
    // 給与は月初に振込・振り分け済み(貯金と各自のお小遣いへ)
    const salaries = [
      {amount:285000, member:0, alloc:[{bucketId:savB.id, amount:50000, goalId:goal.id}, {bucketId:(alwB[0]||savB).id, amount:30000}]},
      {amount:180000, member:1, alloc:[{bucketId:savB.id, amount:30000}, {bucketId:(alwB[1]||alwB[0]||savB).id, amount:20000}]}
    ];
    for(const sal of salaries){
      const tx = {id:uid(), date:dstr(start), amount:sal.amount, categoryId:cat('給与').id,
        memberIndex:sal.member, memo:'給与', special:false, alloc:sal.alloc};
      if(tx.date <= tstr){ S.transactions.push(tx); syncAllocSavings(tx); }
    }
    // daily-ish
    const foods = [[2,1280],[4,860],[6,2340],[9,1540],[11,980],[13,3200],[16,1750],[18,1120],[20,2680],[23,1490],[26,940],[28,2100]];
    for(const [off, amt] of foods){
      const d = new Date(start); d.setDate(d.getDate()+off);
      if(d < end) push(dstr(d), amt, '食費', mi%2===0?1:0, 'スーパー');
    }
    const extras = [[3,'外食',2400,'ランチ',0],[7,'日用品',1680,'ドラッグストア',1],[12,'外食',5600,'週末ごはん',2],
      [15,'交通',3200,'',0],[17,'趣味・娯楽',4300,'映画',2],[21,'衣服・美容',5800,'',1],
      [25,'外食',3800,'',2],[27,'交際費',3000,'プレゼント',1]];
    for(const [off, cn, amt, memo, mem] of extras){
      const d = new Date(start); d.setDate(d.getDate()+off);
      if(d < end) push(dstr(d), amt, cn, mem, memo);
    }
    if(mi === 1){
      const d = new Date(start); d.setDate(d.getDate()+14);
      push(dstr(d), 68000, 'その他', 2, '冷蔵庫買い替え', true);
    }
  });
  S.quickEntries = [
    {id:uid(), label:'コンビニ', amount:500, categoryId:cat('食費').id, memberIndex:0},
    {id:uid(), label:'ランチ', amount:900, categoryId:cat('外食').id, memberIndex:0},
    {id:uid(), label:'カフェ', amount:480, categoryId:cat('外食').id, memberIndex:1}
  ];
  S.recurrings = [
    {id:uid(), name:'家賃', amount:85000, dayOfMonth:startDay(), categoryId:cat('住居').id, memberIndex:2,
      active:true, createdDate:fmtDate(monthRange(key)[0]), createdMonth:key.slice(0,7), lastApplied:tstr.slice(0,7)},
    {id:uid(), name:'給与(夫)', amount:285000, dayOfMonth:startDay(), categoryId:cat('給与').id, memberIndex:0,
      active:true, splits:[{bucketId:savB.id, amount:50000, goalId:goal.id}, {bucketId:(alwB[0]||savB).id, amount:30000}],
      createdDate:fmtDate(monthRange(key)[0]), createdMonth:key.slice(0,7), lastApplied:tstr.slice(0,7)},
  ];
  save();
  UI.histMonth = curMonthKey(); UI.repMonth = curMonthKey();
  render(); toast('サンプルデータを投入しました');
}
function wipeAll(){
  if(!confirm('全データを削除しますか?この操作は元に戻せません。')) return;
  if(!confirm('本当に削除しますか?バックアップは保存済みですか?')) return;
  localStorage.removeItem(LS_KEY);
  S = load(); applyTheme();
  UI.histMonth = curMonthKey(); UI.repMonth = curMonthKey();
  render(); toast('全データを削除しました');
}

/* ================= tab switching / dispatch ================= */
function switchTab(name){
  UI.tab = name;
  $$('section.tab').forEach(s => s.classList.remove('active'));
  $('#tab-' + name).classList.add('active');
  $$('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  render();
  window.scrollTo(0, 0);
}
function render(){
  $('#headSub').textContent = monthLabel(curMonthKey());
  if(UI.tab === 'input') renderInput();
  else if(UI.tab === 'home') renderHome();
  else if(UI.tab === 'history') renderHistory();
  else if(UI.tab === 'report') renderReport();
  else renderSettings();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch(act){
    case 'tab': switchTab(el.dataset.tab); break;
    case 'mode': UI.mode = el.dataset.mode; UI.special = false; renderInput(); break;
    case 'key': keyPress(el.dataset.key); break;
    case 'member': UI.member = Number(el.dataset.i); renderInput(); break;
    case 'special': UI.special = !UI.special; renderInput(); break;
    case 'quick': useQuick(id); break;
    case 'save-cat': saveTx(id); break;
    case 'edit-tx': openEditTx(id); break;
    case 'hist-prev': UI.histMonth = shiftMonth(UI.histMonth,-1); UI.selDay = null; renderHistory(); break;
    case 'hist-next': UI.histMonth = shiftMonth(UI.histMonth, 1); UI.selDay = null; renderHistory(); break;
    case 'hist-view': UI.histView = el.dataset.v; renderHistory(); break;
    case 'cal-day': UI.selDay = (UI.selDay === el.dataset.date ? null : el.dataset.date); renderHistory(); break;
    case 'rep-view': UI.repView = el.dataset.v; renderReport(); break;
    case 'rep-prev': UI.repMonth = shiftMonth(UI.repMonth,-1); renderReport(); break;
    case 'rep-next': UI.repMonth = shiftMonth(UI.repMonth, 1); renderReport(); break;
    case 'repy-prev': UI.repYear--; renderReport(); break;
    case 'repy-next': UI.repYear++; renderReport(); break;
    case 'goal-add': openGoalForm(null); break;
    case 'goal-edit': openGoalForm(id); break;
    case 'goal-deposit': openSavingForm('in', id); break;
    case 'saving-in': openSavingForm('in'); break;
    case 'saving-out': openSavingForm('out'); break;
    case 'saving-del': {
      if(confirm('この入出金記録を削除しますか?(貯金残高に反映されます)')){
        S.savingTxs = S.savingTxs.filter(d => d.id !== id); save(); render();
      } break; }
    case 'goal-del': {
      if(confirm('この目標を削除しますか?\n(積立てたお金は貯金残高に残ります)')){
        for(const st of S.savingTxs) if(st.goalId === id) delete st.goalId;
        S.goals = S.goals.filter(g => g.id !== id); save(); render(); toast('削除しました');
      } break; }
    case 'cat-add': openCatForm(null, el.dataset.type); break;
    case 'cat-edit': openCatForm(id); break;
    case 'cat-up': moveCat(id,-1); break;
    case 'cat-down': moveCat(id, 1); break;
    case 'cat-del': delCat(id); break;
    case 'quick-add': openQuickForm(null); break;
    case 'quick-edit': openQuickForm(id); break;
    case 'quick-del': {
      if(confirm('この定番を削除しますか?')){
        S.quickEntries = S.quickEntries.filter(q => q.id !== id); save(); render(); toast('削除しました');
      } break; }
    case 'rec-add': openRecForm(null); break;
    case 'rec-edit': openRecForm(id); break;
    case 'rec-toggle': {
      const r = S.recurrings.find(x => x.id === id);
      if(r){
        r.active = !r.active;
        if(r.active){ r.lastApplied = todayStr().slice(0,7); r.createdDate = todayStr(); } // resume from now
        save(); renderSettings();
        toast(r.active ? '再開しました(今後の分から記帳されます)' : '停止しました');
      } break; }
    case 'rec-del': {
      if(confirm('この定期取引を削除しますか?(過去に記帳された分は残ります)')){
        S.recurrings = S.recurrings.filter(r => r.id !== id); save(); renderSettings(); toast('削除しました');
      } break; }
    case 'bucket-add': openBucketForm(null); break;
    case 'bucket-edit': openBucketForm(id); break;
    case 'bucket-del': delBucket(id); break;
    case 'mem-add': openMemberForm(null); break;
    case 'mem-edit': openMemberForm(Number(el.dataset.i)); break;
    case 'mem-del': delMember(Number(el.dataset.i)); break;
    case 'backup-export': exportBackup(); break;
    case 'backup-import': $('#importFile').click(); break;
    case 'sample': loadSample(); break;
    case 'wipe': wipeAll(); break;
    case 'modal-close': closeModal(); break;
  }
});

/* ================= init ================= */
applyTheme();
{
  const applied = checkRecurrings();
  if(applied.length) setTimeout(() => toast('🔁 自動記帳: ' + applied.join(' / ')), 400);
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    const applied = checkRecurrings();
    if(applied.length){ toast('🔁 自動記帳: ' + applied.join(' / ')); render(); }
  }
});
switchTab('input');
</script>
