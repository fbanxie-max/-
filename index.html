<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<title>サロン経営管理</title>
<style>
:root{
  --bg:#f7f6f3; --surface:#fcfcfb; --surface2:#f2f1ec;
  --ink:#1a1816; --ink2:#55524d; --muted:#8a877f;
  --line:#e5e3dc; --line2:#d8d6cd;
  --accent:#9c4a66; --accent-hover:#833b54; --accent-ink:#ffffff; --accent-soft:#f6e9ee;
  --income:#2a78d6; --expense:#1baf7a;
  --good:#006300; --good-chip:#e3f2e3; --warn:#8a5a00; --warn-chip:#faf0d8;
  --crit:#b03030; --crit-chip:#f9e4e4; --info:#1c5cab; --info-chip:#e2edfb;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 1px 2px rgba(26,24,22,.05),0 4px 14px rgba(26,24,22,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121110; --surface:#1a1a19; --surface2:#232321;
    --ink:#f4f2ec; --ink2:#c3c2b7; --muted:#8f8d85;
    --line:#2c2c2a; --line2:#3a3a37;
    --accent:#d78ba3; --accent-hover:#e5a4b8; --accent-ink:#2a0f18; --accent-soft:#332028;
    --income:#3987e5; --expense:#199e70;
    --good:#4cc24c; --good-chip:#1d2e1d; --warn:#e5b04d; --warn-chip:#332b17;
    --crit:#e66767; --crit-chip:#341d1d; --info:#6da7ec; --info-chip:#1c2736;
    --grid:#2c2c2a; --axis:#383835;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="light"]{
  --bg:#f7f6f3; --surface:#fcfcfb; --surface2:#f2f1ec;
  --ink:#1a1816; --ink2:#55524d; --muted:#8a877f;
  --line:#e5e3dc; --line2:#d8d6cd;
  --accent:#9c4a66; --accent-hover:#833b54; --accent-ink:#ffffff; --accent-soft:#f6e9ee;
  --income:#2a78d6; --expense:#1baf7a;
  --good:#006300; --good-chip:#e3f2e3; --warn:#8a5a00; --warn-chip:#faf0d8;
  --crit:#b03030; --crit-chip:#f9e4e4; --info:#1c5cab; --info-chip:#e2edfb;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 1px 2px rgba(26,24,22,.05),0 4px 14px rgba(26,24,22,.06);
}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1a1a19; --surface2:#232321;
  --ink:#f4f2ec; --ink2:#c3c2b7; --muted:#8f8d85;
  --line:#2c2c2a; --line2:#3a3a37;
  --accent:#d78ba3; --accent-hover:#e5a4b8; --accent-ink:#2a0f18; --accent-soft:#332028;
  --income:#3987e5; --expense:#199e70;
  --good:#4cc24c; --good-chip:#1d2e1d; --warn:#e5b04d; --warn-chip:#332b17;
  --crit:#e66767; --crit-chip:#341d1d; --info:#6da7ec; --info-chip:#1c2736;
  --grid:#2c2c2a; --axis:#383835;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;min-height:100vh}
/* ---- sidebar ---- */
#sidebar{
  width:208px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
  padding:20px 12px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:4px 12px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .b-name{font-weight:700;font-size:16px;letter-spacing:.02em}
.brand .b-sub{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.navbtn{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 12px;border:0;background:none;color:var(--ink2);
  font:inherit;font-size:13.5px;border-radius:8px;cursor:pointer;
}
.navbtn:hover{background:var(--surface2);color:var(--ink)}
.navbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.navbtn .nb-dot{width:6px;height:6px;border-radius:50%;background:transparent;flex-shrink:0}
.navbtn.on .nb-dot{background:var(--accent)}
.nav-sec{font-size:10.5px;color:var(--muted);letter-spacing:.12em;padding:14px 12px 4px;text-transform:uppercase}
/* ---- main ---- */
#main{flex:1;min-width:0;padding:24px 28px 64px;max-width:1200px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:21px;font-weight:700;letter-spacing:.01em}
.pagehead .ph-sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
/* ---- cards / layout ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h2{font-size:14.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .h2-sub{font-weight:400;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid2>.card{margin-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.tile .t-label{font-size:12px;color:var(--ink2)}
.tile .t-val{font-size:24px;font-weight:700;letter-spacing:.01em;margin-top:2px}
.tile .t-note{font-size:11.5px;color:var(--ink2);margin-top:2px}
.t-good{color:var(--good)} .t-crit{color:var(--crit)}
/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink);
  font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--surface2)}
.btn:focus-visible,.navbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface2)}
.btn:disabled{opacity:.45;cursor:default}
/* ---- tables ---- */
.twrap{overflow-x:auto;
  background:
    linear-gradient(to right, var(--surface) 30%, rgba(255,255,255,0)),
    linear-gradient(to left, var(--surface) 30%, rgba(255,255,255,0)) 100% 0,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent),
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) 100% 0;
  background-repeat:no-repeat;
  background-size:40px 100%,40px 100%,12px 100%,12px 100%;
  background-attachment:local,local,scroll,scroll;}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;color:var(--ink2);font-weight:600;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-top:2px solid var(--line2);background:var(--surface2)}
tr.rowlink{cursor:pointer} tr.rowlink:hover td{background:var(--surface2)}
tr.lowstock td{background:var(--crit-chip)}
/* 給料管理: タップで直接編集できる金額セル */
td.payedit{cursor:pointer}
td.payedit:hover{background:var(--surface2)}
td.payedit .pe-v{border-bottom:1px dashed var(--line2);padding-bottom:1px}
/* ---- chips ---- */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-chip);color:var(--good)}
.chip.warn{background:var(--warn-chip);color:var(--warn)}
.chip.crit{background:var(--crit-chip);color:var(--crit)}
.chip.info{background:var(--info-chip);color:var(--info)}
.chip.mut{background:var(--surface2);color:var(--ink2)}
/* ---- forms ---- */
input,select,textarea{
  font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:8px;padding:7px 10px;width:100%;
}
textarea{resize:vertical;min-height:64px}
input[type=checkbox]{width:auto}
.f-row{margin-bottom:12px}
.f-row label{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.f-row .req{color:var(--crit)}
.f-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.searchbar{max-width:280px}
/* ---- modal ---- */
#modal-root{position:fixed;inset:0;display:none;z-index:50}
#modal-root.open{display:block}
.m-back{position:absolute;inset:0;background:rgba(15,13,12,.45)}
.m-box{
  position:relative;max-width:520px;margin:6vh auto;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);
  padding:20px;max-height:86vh;overflow-y:auto;
}
.m-box h3{font-size:16px;margin-bottom:14px}
.m-box.wide{max-width:760px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
/* ---- register (明細型レジ) ---- */
.reg-cats{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px}
.reg-menus{display:flex;gap:6px;flex-wrap:wrap;max-height:170px;overflow-y:auto;padding:2px}
.reg-sum{margin-top:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:14px}
/* ---- toast ---- */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translate(-50%,12px);
  background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:10px;
  font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
/* ---- misc ---- */
.empty{color:var(--muted);font-size:13px;padding:18px 4px;text-align:center}
.hint{font-size:12px;color:var(--ink2);margin-top:8px}
details.hint summary{cursor:pointer;font-weight:600;color:var(--ink2)}
details.hint[open] summary{margin-bottom:4px}
.mnav{display:inline-flex;align-items:center;gap:6px}
.mnav .mn-label{font-weight:700;font-size:14.5px;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chartwrap{position:relative}
#ctip{
  position:absolute;display:none;background:var(--ink);color:var(--bg);
  border-radius:8px;padding:7px 11px;font-size:12px;pointer-events:none;z-index:5;white-space:nowrap;line-height:1.5;
}
.shiftchip{
  display:block;background:var(--accent-soft);color:var(--accent);border-radius:6px;
  padding:2px 6px;font-size:11.5px;font-weight:600;cursor:pointer;margin:2px 0;border:0;font-family:inherit;width:100%;
}
.addcell{border:1px dashed var(--line2);background:none;color:var(--muted);border-radius:6px;width:100%;padding:2px 0;cursor:pointer;font-size:12px}
.addcell:hover{color:var(--accent);border-color:var(--accent)}
td.today-col{background:var(--accent-soft)}
.rcpt-thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;display:block}
.rcpt-none{width:44px;height:44px;border-radius:6px;border:1px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px}
.imgfull{max-width:100%;border-radius:8px}
.visit-item{border-left:3px solid var(--accent-soft);padding:6px 12px;margin-bottom:8px}
.visit-item .v-date{font-weight:700;font-size:12.5px}
.visit-item .v-body{font-size:13px;color:var(--ink2)}
.alertline{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.alertline:last-child{border-bottom:0}
/* ---- hero (目標達成カード) ---- */
.hero .hr-label{font-size:12.5px;color:var(--muted)}
.hero .hr-val{font-size:clamp(40px,5.5vw,48px);font-weight:700;letter-spacing:.01em;line-height:1.15;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:999px;background:var(--info-chip);overflow:hidden;margin:10px 0 8px}
.meter .m-fill{height:100%;border-radius:999px;background:var(--income)}
.hr-sub{display:flex;gap:6px 20px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.hr-sub strong{font-variant-numeric:tabular-nums}
/* ---- horizontal bars ---- */
.hbar{display:flex;flex-direction:column;gap:9px}
.hb-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:2px}
.hb-label{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-val{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.hb-val .hb-pct{color:var(--muted);font-weight:400;margin-left:4px}
.hb-track{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.hb-fill{height:100%;border-radius:999px}
.hb-foot{font-size:12px;color:var(--ink2);margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
/* ---- mobile ---- */
@media (max-width:760px){
  #app{flex-direction:column}
  #sidebar{
    width:100%;height:auto;position:sticky;top:0;z-index:10;
    flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;
    padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);gap:4px;
  }
  .brand{border:0;margin:0;padding:0 10px 0 4px;flex-shrink:0}
  .brand .b-name{white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .brand .b-sub{display:none}
  .navbtn{width:auto;white-space:nowrap;padding:6px 10px}
  .nav-sec{display:none}
  #main{padding:16px 14px 56px}
  .f-2col{grid-template-columns:1fr}
  /* iOSは16px未満の入力欄タップで画面が自動ズームするため、スマホでは16pxにする */
  input,select,textarea{font-size:16px}
  /* 指で押しやすいボタンサイズ(Apple推奨44ptに近づける) */
  .btn{min-height:44px}
  .btn.sm{min-height:38px;padding:7px 12px}
  /* 表のセルが1文字ずつ縦に潰れないよう1行表示にし、長い文は…で省略(全文は編集画面で見られる) */
  .twrap td{white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  /* モーダルが画面端に張り付かないよう左右に余白を確保 */
  .m-box{margin:12px 8px;max-height:calc(100vh - 24px)}
}
#storagewarn{position:sticky;top:0;z-index:200;background:var(--warn-chip);color:var(--warn);font-size:12.5px;font-weight:600;line-height:1.5;padding:8px 14px;text-align:center;border-bottom:1px solid var(--line2)}
@media print{
  /* ダークテーマ利用中でも印刷は常にライトテーマ(全トークンを強制上書き) */
  :root,:root[data-theme="light"],:root[data-theme="dark"]{
    --bg:#ffffff; --surface:#ffffff; --surface2:#f2f1ec;
    --ink:#1a1816; --ink2:#55524d; --muted:#8a877f;
    --line:#e5e3dc; --line2:#d8d6cd;
    --accent:#9c4a66; --accent-hover:#833b54; --accent-ink:#ffffff; --accent-soft:#f6e9ee;
    --income:#2a78d6; --expense:#1baf7a;
    --good:#006300; --good-chip:#e3f2e3; --warn:#8a5a00; --warn-chip:#faf0d8;
    --crit:#b03030; --crit-chip:#f9e4e4; --info:#1c5cab; --info-chip:#e2edfb;
    --grid:#e1e0d9; --axis:#c3c2b7;
    --shadow:none;
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #sidebar,.ph-actions,.btn,#toast,#storagewarn{display:none !important}
  body{background:#fff;color:var(--ink)}
  #main{max-width:none;padding:0}
  .card,.tile{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar" aria-label="メニュー"></nav>
  <main id="main"></main>
</div>
<div id="modal-root" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<script>
"use strict";
/* ================= state ================= */
const LS_KEY = "salon-mgr-v1";
/* 保存できない環境の警告。claude.aiのArtifactなどサンドボックス・埋め込み表示では
   localStorageが使えない/起動ごとに消えるため、入力前に気づけるようバナーを常時表示する */
(function(){
  let ok = true;
  try{ localStorage.setItem(LS_KEY + "_probe", "1"); localStorage.removeItem(LS_KEY + "_probe"); }catch(e){ ok = false; }
  let framed = false;
  try{ framed = window.self !== window.top; }catch(e){ framed = true; }
  if(ok && !framed) return;
  const div = document.createElement("div");
  div.id = "storagewarn";
  if(!ok){ div.style.background = "var(--crit-chip)"; div.style.color = "var(--crit)"; }
  div.textContent = ok
    ? "⚠ この画面はプレビュー(埋め込み)表示のため、入力したデータが保存されず、閉じると消える場合があります。毎日の利用は保存できるURL(GitHub Pagesなど)をホーム画面に追加してください。"
    : "⚠ この表示環境ではデータを端末に保存できません。入力した内容はアプリを閉じると消えます。保存できるURL(GitHub Pagesなど)から開き直してください。";
  document.body.prepend(div);
})();
const DEFAULTS = {
  settings: { name: "マイサロン", target: 0, targets: {}, lastBackup: "", payClose: 20, payDay: 25, payMonth: "same", closedWd: [], closedDates: [], minWage: 0, tax: { type: "blue65", ct: "kanni", ctFrom: 2027, deds: {} } }, // target: 共通の月間売上目標(円)、targets: 月別の上書き{'YYYY-MM':円}、lastBackup: 最終バックアップ日。payClose: 給与締日(1-28、31=末日)、payDay: 給与支払日(同)、payMonth: 'same'当月払い|'next'翌月払い。closedWd: 定休日の曜日番号(0=日〜6=土)、closedDates: 臨時休業日['YYYY-MM-DD']。旧バックアップにはキーが無いため利用側でガードする
  staff: [],      // {id,name,role,payType:'hourly'|'monthly',wage,commission}
  tx: [],         // {id,date,type:'income'|'expense',category,amount,memo,staffId,pay(収入のみ),taxRate(旧データの税区分。入力欄は廃止・CSV出力互換のため保持),bulk(過去実績まとめ入力=true)}
  receipts: [],   // {id,date,vendor,amount,category,memo,img}
  shifts: [],     // {id,staffId,date,start,end,note} 旧データのbrk(休憩)は使用しない(休憩も時給支払いの方針)
  payAdj: {},     // key `${staffId}_${month}` -> {allow,deduct,memo,paid,booked}
  orders: [],     // {id,date,supplier,item,qty,unit,amount,memo,status,invId,deliveredDate,booked}
  inv: [],        // {id,name,category,qty,unit,minQty,price,menuCat,useQty}
  customers: [],  // {id,name,kana,phone,birthday,memo,visits:[{id,date,menu,staffId,price,note,img}]}
  appts: [],      // {id,date,time,name,customerId,menu,staffId,price,status:'open'|'done'|'cancel',memo,dur,nominated,nextApptId}
  closings: {},   // key 'YYYY-MM-DD' -> {float,actual,floatCnt:{金種:枚数},actualCnt,memo,closed} レジ締め
  tickets: [],    // {id,customerId,name,total,used,price,date,memo} 回数券
  menus: [],      // {id,name,price,cat,dur,cost} メニュー料金表(組み合わせメニュー可)。catは集計カテゴリ、costは材料原価(任意)

   - settingsは初期値と合成(古いバックアップに無い設定キーを補う)

function normalizeState(d){
  const s = Object.assign(structuredClone(DEFAULTS), d);
  for(const k of ["staff","tx","receipts","shifts","orders","inv","customers","appts","tickets","menus","recurring"])
    if(!Array.isArray(s[k])) s[k] = [];
  for(const k of ["payAdj","closings","staffStats"]) if(!s[k] || typeof s[k] !== "object") s[k] = {};
  s.settings = Object.assign(structuredClone(DEFAULTS.settings), (d && d.settings) || {});
  s.customers.forEach(c => { if(!Array.isArray(c.visits)) c.visits = []; });
  const ownerIds = new Set(s.staff.filter(st => st.owner === "1").map(st => st.id));
  s.tx.forEach(t => {
    /* 旧バージョンで「支出に計上」した給与に印を付け直す(利益・納税予想の二重引き防止に使用) */
    if(t.type === "expense" && t.category === "人件費" && t.staffId && /分給与$/.test(t.memo || "") && t.payrollBooked === undefined) t.payrollBooked = true;
    /* 事業主本人の給与計上は「事業主貸(経費外の受け取り記録)」へ変換する。事業主の給料は経費・支出ではなく利益の取り分のため */
    if(t.type === "expense" && t.payrollBooked && t.staffId && ownerIds.has(t.staffId) && !t.ownerDraw){ t.ownerDraw = true; t.category = "事業主貸"; }
    /* 旧バージョンの「1日まとめ入力」(技術+店販の2件)を1会計として数えるようにする */
    if(t.daily && !t.saleId) t.saleId = "daily-" + t.date;

  const safeImg = v => (typeof v === "string" && v.startsWith("data:image/")) ? v : "";
  s.receipts.forEach(r => { if(r.img) r.img = safeImg(r.img); });
  s.customers.forEach(c => c.visits.forEach(v => { if(v.img) v.img = safeImg(v.img); }));

}

  const withStaff = done.filter(a => a.staffId);
  return { done: done.length, withStaff: withStaff.length,
    nom: withStaff.filter(a => a.nominated).length,
    next: done.filter(a => a.nextApptId).length };
}
function lostCustomers(days){
  const t = todayStr();
  return S.customers.map(c => {
    const last = (c.visits || []).reduce((a,v) => (v.date && v.date > a) ? v.date : a, "");
    return { c, last, gap: last ? daysDiff(last, t) : null };
  }).filter(x => x.last && x.gap >= days).sort((a,b) => b.gap - a.gap);
}
function birthdayList(m){
  const mo = m.slice(5);
  return S.customers.filter(c => c.birthday && c.birthday.slice(5,7) === mo)
    .sort((a,b) => a.birthday.slice(8).localeCompare(b.birthday.slice(8)));
}
/* メニューに紐づいた在庫を売上記録時に自動減算。減算した品名を返す(記録時のみ。編集・削除では戻らない) */
function consumeInv(category){
  const used = [];
  S.inv.forEach(i => {
    if(i.menuCat && i.menuCat === category){
      i.qty = Math.max(0, num(i.qty) - (num(i.useQty) > 0 ? num(i.useQty) : 1));
      used.push(i.name);
    }
  });
  return used;
}

/* 同一担当・同日の時間帯重複(status openのみ対象)。所要時間未設定は60分扱い */
function apptConflict(v, excludeId){
  if(!v.staffId) return null;
  const s = toMin(v.time), e = s + (num(v.dur) > 0 ? num(v.dur) : 60);
  return S.appts.find(a => {
    if(a.id === excludeId || a.date !== v.date || (a.staffId || "") !== v.staffId || a.status !== "open") return false;
    const as = toMin(a.time), ae = as + (num(a.dur) > 0 ? num(a.dur) : 60);
    return s < ae && as < e;
  }) || null;
}
function hbarHtml(entries, total, color, fmt){
  const f = fmt || yen;
  const max = Math.max(1, ...entries.map(e => e[1]));
  return `<div class="hbar">` + entries.map(([label, v]) => {
    const pct = total > 0 ? Math.round(v / total * 100) : 0;
    return `<div><div class="hb-top"><span class="hb-label">${esc(label)}</span><span class="hb-val">${f(v)}<span class="hb-pct">${pct}%</span></span></div>
      <div class="hb-track"><div class="hb-fill" style="width:${Math.min(100, v / max * 100).toFixed(1)}%;background:${color}"></div></div></div>`;
  }).join("") + `</div>`;
}

/* ---- 定休日・臨時休業 ----
   未設定なら全日営業扱い(=暦日と同じ)になるため、旧データでも挙動は変わらない */
const wdOf = iso => new Date(+iso.slice(0,4), +iso.slice(5,7) - 1, +iso.slice(8)).getDay();
const isClosedDay = iso => (S.settings.closedWd || []).includes(wdOf(iso)) || (S.settings.closedDates || []).includes(iso);
const hasClosedCfg = () => (S.settings.closedWd || []).length > 0 || (S.settings.closedDates || []).length > 0;
/* from〜to(両端含む)の営業日数。最長でも月単位でしか使わないため単純ループで数える */
function bizDaysBetween(from, to){
  let n = 0;
  for(let d = from; d <= to; d = addDays(d, 1)) if(!isClosedDay(d)) n++;
  return n;
}
/* 定期支出の自動計上: 前回計上月の翌月から今月まで、計上日を過ぎた分を支出に追加する */
function applyRecurring(){
  const cur = thisMonth(), today = todayStr();
  let n = 0;
  (S.recurring || []).forEach(r => {
    let m = r.lastM ? addMonths(r.lastM, 1) : (r.startM || cur);
    while(m <= cur){
      const day = Math.min(Math.max(1, num(r.day) || 1), daysInMonth(m));
      const d = m + "-" + String(day).padStart(2, "0");
      if(d > today) break;
      S.tx.push({id: uid(), type:"expense", date: d, category: r.category || "雑費", amount: num(r.amount), memo:`${r.name}(定期支出・自動計上)`, staffId:"", taxRate: r.taxRate || "10", recId: r.id});
      r.lastM = m; n++;
      m = addMonths(m, 1);
    }
  });
  if(n) save();
  return n;
}

/* ---- 給与の締日・支払日 ----
   旧データ・旧バックアップには設定キーが無いため、既定値(20日締め・当月25日払い)にフォールバックする */
const payCloseDay = () => { const c = num(S.settings.payClose); return c >= 1 ? Math.min(c, 31) : 20; };
const paySalaryDay = () => { const d = num(S.settings.payDay); return d >= 1 ? Math.min(d, 31) : 25; };
const payCloseLabel = () => payCloseDay() >= 31 ? "末日" : payCloseDay() + "日";
const payDayLabel = () => (S.settings.payMonth === "next" ? "翌月" : "当月") + (paySalaryDay() >= 31 ? "末日" : paySalaryDay() + "日");
/* 'YYYY-MM'分給与の対象期間 = 前月締日の翌日〜当月締日。締日=末日(31)はカレンダー月と同じ。
   締日が月の日数を超える月は末日締め扱い(addDaysの繰り上がりで翌月1日始まりになる) */
function payPeriod(m){
  const c = payCloseDay();
  if(c >= 31) return { from: m + "-01", to: m + "-" + String(daysInMonth(m)).padStart(2, "0") };
  const pm = addMonths(m, -1);
  return {
    from: addDays(pm + "-" + String(Math.min(c, daysInMonth(pm))).padStart(2, "0"), 1),
    to: m + "-" + String(Math.min(c, daysInMonth(m))).padStart(2, "0")
  };
}
/* 'YYYY-MM'分給与の支払日。当月/翌月 × 支払日(月の日数を超える場合は末日) */
function payDate(m){
  const pm = S.settings.payMonth === "next" ? addMonths(m, 1) : m;
  return pm + "-" + String(Math.min(paySalaryDay(), daysInMonth(pm))).padStart(2, "0");
}
/* その月に適用される給与条件(昇給などの改定履歴を考慮)。
   st.hist = [{until:'YYYY-MM', payType, wage, commission}] は「その月まで有効だった旧条件」の記録 */
function payParamsFor(st, m){
  if(st.hist && st.hist.length){
    const c = st.hist.filter(h => h.until && m <= h.until).sort((a, b) => a.until.localeCompare(b.until));
    if(c.length) return c[0];
  }
  return st;
}
function calcPay(st, m){
  const adj = S.payAdj[st.id + "_" + m] || {};
  const P = payParamsFor(st, m);
  const pp = payPeriod(m);
  const shs = S.shifts.filter(s2 => s2.staffId === st.id && s2.date >= pp.from && s2.date <= pp.to);
  let hours = 0, otH = 0, nightH = 0;
  shs.forEach(s2 => { const d = shiftDetail(s2); hours += d.total; otH += d.ot; nightH += d.night; });
  const days = new Set(shs.map(s2 => s2.date)).size;
  const hourly = P.payType !== "monthly";
  const base = hourly ? Math.round(hours * num(P.wage)) : num(P.wage);
  /* 法定割増(時給者のみ自動計算): 1日8時間超と22時以降の深夜は各25%増し。
     月給者・歩合分の割増と週40時間超の割増は自動計算していない(画面で警告) */
  const extra = hourly ? Math.round((otH + nightH) * num(P.wage) * 0.25) : 0;
  /* 担当売上: 「スタッフ実績」の月次まとめ入力があればそれを優先、なければ担当付きの売上記録(締日期間)から自動集計 */
  const manSales = manualStaffSales(st.id, m);
  const sales = manSales !== null ? manSales
    : S.tx.filter(t => t.type === "income" && t.staffId === st.id && t.date >= pp.from && t.date <= pp.to).reduce((a,t) => a + num(t.amount), 0);
  const comm = Math.round(sales * num(P.commission) / 100);
  /* 手当・控除は項目別(通勤手当・源泉所得税・雇用保険料)。旧データはallow/deductのみでそのまま動く */
  const commute = num(adj.commute), allowOther = num(adj.allow);
  const srcTax = num(adj.srcTax), empIns = num(adj.empIns), deductOther = num(adj.deduct);
  const allow = commute + allowOther, deduct = srcTax + empIns + deductOther;
  const total = base + extra + comm + allow - deduct;
  return { hours, otH, nightH, days, base, extra, sales, comm,
    commute, allowOther, srcTax, empIns, deductOther, allow, deduct, total,
    paid: !!adj.paid, booked: !!adj.booked, memo: adj.memo || "" };
}

/* 目標達成ヒーローカード(当月専用) */
function heroHtml(){
  const m = thisMonth(), tday = todayStr();
  const s = monthSummary(m);
  const target = targetFor(m);
  const day = +tday.slice(8), dim = daysInMonth(m);
  /* 営業日ベースの日割り。定休日・臨時休業が未設定なら暦日と一致する */
  const eom = m + "-" + String(dim).padStart(2, "0");
  const bizPassed = bizDaysBetween(m + "-01", tday), bizTotal = bizDaysBetween(m + "-01", eom);
  const forecast = day >= 3 ? Math.round(s.inc / Math.max(1, bizPassed) * bizTotal) : null;
  const pm = addMonths(m, -1);
  const pmCut = pm + "-" + String(Math.min(day, daysInMonth(pm))).padStart(2, "0");
  /* 前月同時点の売上。まとめ入力(bulk)の月は日別データがないため日割りで換算する */
  const pmList = S.tx.filter(t => t.type === "income" && t.date && t.date.startsWith(pm));
  const pmInc = pmList.filter(t => !t.bulk && t.date <= pmCut).reduce((a,t) => a + num(t.amount), 0)
    + Math.round(pmList.filter(t => t.bulk).reduce((a,t) => a + num(t.amount), 0) * Math.min(day, daysInMonth(pm)) / daysInMonth(pm));
  const pct = target > 0 ? s.inc / target * 100 : 0;
  const meter = target > 0
    ? `<div class="meter" role="img" aria-label="目標達成率 ${Math.round(pct)}%"><div class="m-fill" style="width:${Math.min(100, pct).toFixed(1)}%"></div></div>`
    : `<div class="hint" style="margin:8px 0 6px">月間売上目標が未設定です。設定画面で登録すると達成メーターが表示されます。 <button class="btn sm" onclick="go('settings')">設定へ</button></div>`;
  const subs = [];
  if(target > 0){
    subs.push(`目標 <strong>${yen(target)}</strong>`);
    subs.push(`達成 <strong>${Math.round(pct)}%</strong>`);
    /* 逆算: 残額を残り営業日数(今日含む)で割って「今日いくら売ればよいか」を示す */
    const remain = target - s.inc, daysLeft = bizDaysBetween(tday, eom);
    const dayLabel = hasClosedCfg() ? "営業日" : "日";
    subs.push(remain > 0
      ? (daysLeft > 0
        ? `あと <strong>${yen(remain)}</strong>(1日あたり <strong>${yen(Math.ceil(remain / daysLeft))}</strong> × 残り${daysLeft}${dayLabel})`
        : `あと <strong>${yen(remain)}</strong>(今月の営業日は残っていません)`)
      : `<strong style="color:var(--good)">目標達成!</strong>(+${yen(-remain)})`);
  }
  subs.push(`着地見込み <strong>${forecast === null ? "算出中(3日経過後に表示)" : yen(forecast)}</strong>`);
  subs.push(`前月同日比 <strong${pmInc > 0 ? ` style="color:${s.inc >= pmInc ? "var(--good)" : "var(--crit)"}"` : ""}>${pmInc > 0 ? (s.inc >= pmInc ? "+" : "−") + Math.abs(Math.round((s.inc - pmInc) / pmInc * 100)) + "%" : "前月実績なし"}</strong>`);
  return `<div class="card hero">
    <div class="hr-label">${fmtMonth(m)}の売上</div>
    <div class="hr-val">${yen(s.inc)}</div>
    ${meter}
    <div class="hr-sub">${subs.map(x => `<span>${x}</span>`).join("")}</div>
  </div>`;
}

function fmtAxis(n){

/* 2本組の棒グラフSVG(月別収支・前年対比で共用)。items: [{label, a, b}] */
function groupedBarsSvg(items, colorA, colorB, ariaLabel){
  const W = 660, H = 230, padL = 58, padR = 10, padT = 10, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const rawMax = Math.max(1, ...items.flatMap(d => [d.a, d.b]));
  const STEPS = 4;
  const unit = Math.pow(10, Math.floor(Math.log10(rawMax / STEPS)));
  let step = Math.ceil(rawMax / STEPS / unit) * unit;
  for(const nice of [1, 2, 2.5, 5, 10]){ if(nice * unit * STEPS >= rawMax){ step = nice * unit; break; } }
  const yMax = step * STEPS;
  const y = v => padT + plotH - (v / yMax) * plotH;
  const groupW = plotW / items.length;
  const barW = Math.min(26, (groupW - 18) / 2);
  let grid = "", bars = "", hits = "", labels = "";
  for(let i = 1; i <= STEPS; i++){
    const gy = y(step * i);
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${gy}" y2="${gy}" stroke="var(--grid)" stroke-width="1"/>`;
    labels += `<text x="${padL - 8}" y="${gy + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${fmtAxis(step * i)}</text>`;
  }
  items.forEach((d, i) => {
    const cx = padL + groupW * i + groupW / 2;
    const x1 = cx - barW - 1, x2 = cx + 1; // 2px gap between the pair
    bars += barPath(x1, y(d.a), barW, padT + plotH, colorA);
    bars += barPath(x2, y(d.b), barW, padT + plotH, colorB);
    labels += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${d.label}</text>`;
    hits += `<rect data-ci="${i}" x="${padL + groupW * i}" y="${padT}" width="${groupW}" height="${plotH}" fill="transparent" class="c-hit"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${ariaLabel}">
    ${grid}<line x1="${padL}" x2="${W - padR}" y1="${padT + plotH}" y2="${padT + plotH}" stroke="var(--axis)" stroke-width="1"/>
    ${bars}${labels}${hits}</svg>`;
}
function monthlyChartHtml(base, n){
  const months = lastMonths(n || 6, base);
  _chartData = months.map(m => {
    const t = txInMonth(m);
    return { m, inc: sumTx(t, "income"), exp: sumTx(t, "expense") };
  });

  const table = `<div class="twrap" style="margin-top:10px"><table>
    <tr><th>月</th><th class="num">収入</th><th class="num">支出</th><th class="num">差引</th></tr>
    ${_chartData.map(d => `<tr><td>${fmtMonth(d.m)}</td><td class="num">${yen(d.inc)}</td><td class="num">${yen(d.exp)}</td><td class="num" style="color:${d.inc - d.exp >= 0 ? "var(--good)" : "var(--crit)"}">${yen(d.inc - d.exp)}</td></tr>`).join("")}
  </table></div>`;
  return `<div class="legend"><span><span class="sw" style="background:var(--income)"></span>収入</span><span><span class="sw" style="background:var(--expense)"></span>支出</span></div>
    <div class="chartwrap">${groupedBarsSvg(items, "var(--income)", "var(--expense)", "月別の収入と支出の棒グラフ。詳細は下の表を参照。")}<div id="ctip"></div></div>${table}`;
}
function barPath(x, top, w, bottom, fill){
  const h = bottom - top;
  if(h < 0.5) return "";
  const r = Math.min(4, h, w / 2);
  return `<path d="M${x},${bottom} L${x},${top + r} Q${x},${top} ${x + r},${top} L${x + w - r},${top} Q${x + w},${top} ${x + w},${top + r} L${x + w},${bottom} Z" fill="${fill}"/>`;
}
function attachChartTips(){
  const tip = $("ctip");
  if(!tip) return;
  document.querySelectorAll(".c-hit").forEach(r => {
    r.addEventListener("mousemove", ev => {
      const d = _chartData[+r.dataset.ci];
      tip.innerHTML = d.tip || `<strong>${fmtMonth(d.m)}</strong><br>収入 ${yen(d.inc)}<br>支出 ${yen(d.exp)}<br>差引 ${yen(d.inc - d.exp)}`;
      tip.style.display = "block";
      const wrap = r.closest(".chartwrap").getBoundingClientRect();
      let x = ev.clientX - wrap.left + 14, ty = ev.clientY - wrap.top - 10;
      if(x + 150 > wrap.width) x -= 165;
      tip.style.left = x + "px"; tip.style.top = ty + "px";
    });
    r.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
}

function dailyRows(m){
  const rows = [];
  for(let i = 1; i <= daysInMonth(m); i++){
    const d = m + "-" + String(i).padStart(2, "0");
    const list = S.tx.filter(t => t.date === d);
    const c = S.closings[d];
    if(!list.length && !c) continue;
    const incL = list.filter(t => t.type === "income");
    const inc = incL.reduce((a,t) => a + num(t.amount), 0);
    const exp = list.filter(t => t.type === "expense" && !t.ownerDraw).reduce((a,t) => a + num(t.amount), 0);
    const cash = incL.filter(t => !t.pay || t.pay === "現金").reduce((a,t) => a + num(t.amount), 0);
    const diff = c && c.closed ? num(c.actual) - (num(c.float) + cash) : null;
    rows.push({ d, inc, count: salesCount(incL), exp, closed: !!(c && c.closed), diff, memo: (c && c.memo) || "" });
  }
  return rows;
}

/* 曜日別売上・時間帯別来店(直近90日、まとめ入力は除外) */
function trendCardsHtml(){
  const from = addDays(todayStr(), -89);
  const list = S.tx.filter(t => t.type === "income" && !t.bulk && t.date && t.date >= from);
  const wd = Array(7).fill(0);
  list.forEach(t => { const [y, mo, d] = t.date.split("-").map(Number); wd[new Date(y, mo - 1, d).getDay()] += num(t.amount); });
  const wdEntries = [1, 2, 3, 4, 5, 6, 0].map(i => [WD[i] + "曜日", wd[i]]);
  const total = wd.reduce((a, v) => a + v, 0);
  const done = S.appts.filter(a => a.status === "done" && a.date >= from && a.time);
  const hours = {};
  done.forEach(a => { const h = +a.time.slice(0, 2); hours[h] = (hours[h] || 0) + 1; });
  const hourEntries = Object.keys(hours).map(Number).sort((a, b) => a - b).map(h => [`${h}時台`, hours[h]]);
  return `<div class="grid2" style="margin-bottom:16px">
    <div class="card"><h2>曜日別売上 <span class="h2-sub">直近90日</span></h2>
      ${total ? hbarHtml(wdEntries, total, "var(--income)") : `<div class="empty">直近90日の売上記録がありません</div>`}
      <div class="hint">忙しい曜日・暇な曜日の把握に。定休日やキャンペーン曜日の検討材料になります。</div>
    </div>
    <div class="card"><h2>時間帯別の来店 <span class="h2-sub">直近90日</span></h2>
      ${hourEntries.length ? hbarHtml(hourEntries, done.length, "var(--accent)", v => v + "件") : `<div class="empty">来店処理した予約がまだありません</div>`}

    </div>

/* 売上の前年対比カード(1〜12月の月別売上を前年と並べる) */
function yoyCardHtml(yr){
  const prevYr = String(+yr - 1);
  const cur = [], prev = [];
  for(let i = 1; i <= 12; i++){
    const mm = String(i).padStart(2, "0");
    cur.push(sumTx(txInMonth(`${yr}-${mm}`), "income"));
    prev.push(sumTx(txInMonth(`${prevYr}-${mm}`), "income"));
  }
  const hasPrev = prev.some(v => v > 0), hasCur = cur.some(v => v > 0);
  const head = `<h2>売上の前年対比 <span class="h2-sub">${prevYr}年 vs ${yr}年(月別売上)</span></h2>`;
  if(!hasPrev && !hasCur) return `<div class="card">${head}<div class="empty">まだ売上データがありません</div></div>`;
  const items = cur.map((v, i) => ({ label: (i + 1) + "月", a: prev[i], b: v }));
  const yoyPct = (p, c2) => p > 0 ? `<span style="color:${c2 >= p ? "var(--good)" : "var(--crit)"}">${(c2 >= p ? "+" : "−") + Math.abs(Math.round((c2 - p) / p * 100))}%</span>` : "—";
  _chartData = items.map((d, i) => ({ tip: `<strong>${i + 1}月</strong><br>${prevYr}年 ${yen(d.a)}<br>${yr}年 ${yen(d.b)}<br>${d.a > 0 ? `増減 ${(d.b >= d.a ? "+" : "−") + Math.abs(Math.round((d.b - d.a) / d.a * 100))}%` : "前年実績なし"}` }));
  const totPrev = prev.reduce((a,v) => a + v, 0), totCur = cur.reduce((a,v) => a + v, 0);
  const table = `<div class="twrap" style="margin-top:10px"><table>
    <tr><th>月</th><th class="num">${prevYr}年</th><th class="num">${yr}年</th><th class="num">増減率</th></tr>
    ${items.map((d, i) => (d.a || d.b) ? `<tr><td>${i + 1}月</td><td class="num">${yen(d.a)}</td><td class="num">${yen(d.b)}</td><td class="num">${yoyPct(d.a, d.b)}</td></tr>` : "").join("")}
    <tr class="total"><td>年計</td><td class="num">${yen(totPrev)}</td><td class="num">${yen(totCur)}</td><td class="num">${yoyPct(totPrev, totCur)}</td></tr>
  </table></div>`;
  return `<div class="card">${head}
    <div class="legend"><span><span class="sw" style="background:var(--axis)"></span>${prevYr}年</span><span><span class="sw" style="background:var(--income)"></span>${yr}年</span></div>
    <div class="chartwrap">${groupedBarsSvg(items, "var(--axis)", "var(--income)", "前年と今年の月別売上を並べた棒グラフ。詳細は下の表を参照。")}<div id="ctip"></div></div>
    ${hasPrev ? "" : `<div class="hint">前年(${prevYr}年)の実績データがまだありません。2年分のデータが貯まると増減率も表示されます。</div>`}
    ${table}</div>`;
}

/* ---- 1日の経費まとめ入力 ----

   カテゴリは「経費まとめ」固定。dailyExpフラグで管理し、編集はこのフォームに戻す */
window.openDailyExp = function(date){
  const d = date || todayStr();
  const ex = S.tx.filter(t => t.dailyExp && t.type === "expense" && t.date === d);
  const cur = { date: d, amount: ex.reduce((a, t) => a + num(t.amount), 0) || "", memo: (ex.length && ex[0].memo !== "1日の経費まとめ") ? ex[0].memo : "" };
  openForm({ title: "1日の経費まとめ入力", data: cur, saveLabel: "保存(同じ日は上書き)",
    fields: [
      {key:"date", label:"日付", type:"date", value: d, required:true, half:true},
      {key:"amount", label:"経費の合計(円)", type:"number", min:0, half:true},
      {key:"memo", label:"メモ(任意・何に使ったかざっくり)", type:"text", placeholder:"例: 材料仕入と消耗品"}
    ],
    onsave: v => {
      const val = Math.max(0, num(v.amount));
      S.tx = S.tx.filter(t => !(t.dailyExp && t.type === "expense" && t.date === v.date));
      if(val > 0) S.tx.push({id: uid(), dailyExp: true, type: "expense", date: v.date, category: "経費まとめ", amount: val, memo: v.memo || "1日の経費まとめ", staffId: ""});
      save(); toast(val > 0 ? `${fmtDate(v.date)}の経費 ${yen(val)} を保存しました(同じ日は上書き)` : `${fmtDate(v.date)}の経費まとめを削除しました`); render();
    } });
};
window.addTx = function(type){

    onsave: v => {

      S.tx.push({id: uid(), type, ...v, category: cat});
      const used = type === "income" ? consumeInv(cat) : [];

window.editTx = function(id){
  const t = S.tx.find(x => x.id === id); if(!t) return;
  if(t.daily && t.type === "income"){ openDailySale(t.date); return; } // 日計まとめはまとめフォームで編集
  if(t.dailyExp){ openDailyExp(t.date); return; } // 1日の経費まとめも同様
  openForm({ title:"記録を編集", fields: txFields(t.type), data: t,

  }).join("");
  $("main").innerHTML =

    (S.staff.length

      : `<div class="card"><div class="empty">先にスタッフを登録してください。<br><br><button class="btn pri" onclick="go('staff')">スタッフ登録へ</button></div></div>`);
};
function shiftFields(){
  return [
    {key:"start", label:"開始", type:"time", value:"10:00", required:true, half:true},
    {key:"end", label:"終了", type:"time", value:"19:00", required:true, half:true},
    {key:"note", label:"メモ", type:"text"}
  ];
}
const shiftValidate = v => toMin(v.end) <= toMin(v.start) ? "終了時刻は開始より後にしてください" : "";
/* シフトの日付がどの月の給与に入るか(締日をまたぐと翌月分になる) */
function payMonthOf(d){
  const m = d.slice(0, 7);
  const pp = payPeriod(m);
  return (d >= pp.from && d <= pp.to) ? m : addMonths(m, 1);
}
/* 保存前の注意(計上済み給与とのズレ)。空配列なら問題なし */
function shiftWarnings(staffId, date, v){
  const msgs = [];
  const pm = payMonthOf(date);
  if((S.payAdj[staffId + "_" + pm] || {}).booked) msgs.push(`${fmtMonth(pm)}分の給与はすでに支出に計上済みのため、変更すると計上額と表示額がズレます`);
  return msgs;
}
window.addShift = function(staffId, date){
  openForm({ title: `${staffName(staffId)} ・ ${fmtDate(date)} のシフト`, fields: shiftFields(), validate: shiftValidate,
    onsave: v => {
      const doIt = () => { S.shifts.push({id: uid(), staffId, date, ...v}); save(); toast("シフトを登録しました"); render(); };
      const w = shiftWarnings(staffId, date, v);
      if(w.length) ask(w.join("。") + "。このまま保存しますか?", doIt); else doIt();
    } });
};
window.editShift = function(id){

  window._delShift = () => { closeModal(); ask("このシフトを削除しますか?", () => { S.shifts = S.shifts.filter(x => x.id !== id); save(); toast("削除しました"); render(); }); };

    onsave: v => {
      const doIt = () => { Object.assign(s, v); save(); toast("更新しました"); render(); };
      const w = shiftWarnings(s.staffId, s.date, v);

      lawWarns.push(`${st.name}: 支給額が月8.8万円以上ですが源泉所得税が0円です。「調整」から天引き額を入れてください(税額表は国税庁サイト参照)`);

/* 利益カード: 売上 − 経費 − 給料 = 利益。

function payProfitHtml(m, payTotal){
  const list = txInMonth(m);

  const expLabor = list.filter(t => t.type === "expense" && t.payrollBooked && !t.ownerDraw).reduce((a, t) => a + num(t.amount), 0);
  const profit = inc - expOther - payTotal;
  return `<div class="card"><h2>${fmtMonth(m)}の利益 <span class="h2-sub">売上 − 経費 − 給料</span></h2>

/* ---- 給料管理のセル直接編集 ----
   表示中の月(m)から新しい給与条件で計算し、それより前の月は旧条件を履歴(hist)に自動で残す。
   スタッフ編集の「適用開始月」を使わなくても、見ている月の金額をタップで変えるだけで昇給できる */
function applyPayChangeFrom(st, m, patch){
  const pm = addMonths(m, -1);
  const before = payParamsFor(st, pm);
  /* m以降まで有効と記録された旧条件は前月で打ち切る(今回の変更が優先) */
  st.hist = (st.hist || []).map(h => h.until >= m ? {...h, until: pm} : h);
  const seen = {};
  st.hist = st.hist.filter(h => seen[h.until] ? false : (seen[h.until] = true));
  /* 前月までは変更前の条件のまま計算されるよう履歴に残す */
  if(!st.hist.some(h => h.until === pm))
    st.hist.push({ until: pm, payType: before.payType, wage: before.wage, commission: before.commission });
  Object.assign(st, patch);
}

window.bookPay = function(staffId){
  const st = S.staff.find(s => s.id === staffId); if(!st) return;
  const m = V.payMonth;
  const p = calcPay(st, m);
  const isOwner = st.owner === "1";
  const msg = isOwner
    ? `${st.name}(事業主)の${fmtMonth(m)}分 ${yen(p.total)} を「事業主貸(利益からの受け取り)」として記録し、支払済にしますか?経費・支出には数えません(計上日: 支払日 ${fmtDate(payDate(m))})`

  });

      <div class="hint">・ここの入力は<strong>分析と歩合計算のための集計</strong>で、店の売上に二重に足されることはありません(売上そのものは収支管理・1日まとめ入力・過去実績で記録してください)。<br>

      <div class="twrap"><table>

window.editStaff = function(id){
  const st = S.staff.find(x => x.id === id); if(!st) return;
  const fields = [...staffFields(),
    {key:"applyM", label:"給与改定の適用開始月(昇給・歩合変更時のみ。指定するとそれ以前の月は旧額のまま計算。空欄なら過去の月もすべて新しい内容で再計算)", type:"month"}];
  openForm({ title:"スタッフを編集", fields, data: st,

  return `${a.name}様\nいつもありがとうございます。${S.settings.name}です。\n${relDay(a.date)} ${a.time}より${a.menu ? `${a.menu}の` : ""}ご予約を承っております。ご来店を心よりお待ちしております。`;
}

/* ---- 予約→顧客カルテの自動反映 ----
   同名カルテが1件なら自動紐づけ。同姓同名が複数いる場合は電話番号の一致で自動特定し、
   特定できなければ誕生日・電話・最終来店日つきの選択画面でどのお客様か選ぶ(別人として新規作成も可) */
const normPhone = p => String(p || "").replace(/[^0-9]/g, "");
function custBackfill(c, v){
  if(v.kana && !c.kana) c.kana = v.kana;
  if(v.phone && !c.phone) c.phone = v.phone;
}
function newCustomer(v){
  const c = {id: uid(), name: v.name, kana: v.kana || "", phone: v.phone || "", birthday:"", memo:"", visits: []};
  S.customers.push(c);
  return c;
}
function resolveCustomer(v, done){ // done(cust, isNew)
  const matches = S.customers.filter(x => x.name === v.name);
  if(!matches.length){ done(newCustomer(v), true); return; }
  if(matches.length === 1){ custBackfill(matches[0], v); done(matches[0], false); return; }
  if(v.phone){
    const hit = matches.filter(x => normPhone(x.phone) && normPhone(x.phone) === normPhone(v.phone));
    if(hit.length === 1){ custBackfill(hit[0], v); done(hit[0], false); return; }
  }
  const fmtB = b => b ? b.split("-").map((x, i) => i ? +x : x).join("/") : "未登録";
  const lastV = c => { const d = (c.visits || []).map(x => x.date).sort().pop(); return d ? fmtDate(d) : "来店記録なし"; };
  window._pickCust = cid => {
    closeModal();
    if(cid){ const c = S.customers.find(x => x.id === cid); if(!c) return; custBackfill(c, v); done(c, false); }
    else done(newCustomer(v), true);
  };
  openModal(`<h3>同姓同名のお客様がいます</h3>
    <p style="font-size:13px;color:var(--ink2);margin-bottom:12px">「${esc(v.name)}」様のカルテが${matches.length}件あります。誕生日・電話番号・最終来店日を見て、どのお客様の予約か選んでください。</p>
    ${matches.map(c => `<button class="btn" style="display:block;width:100%;text-align:left;margin-bottom:8px" onclick="_pickCust('${c.id}')">
      <strong>${esc(c.name)}</strong><br>
      <span style="font-size:12px;color:var(--muted)">誕生日 ${esc(fmtB(c.birthday))} ・ 電話 ${esc(c.phone || "未登録")} ・ 最終来店 ${lastV(c)}${c.memo ? ` ・ ${esc(c.memo.slice(0, 18))}` : ""}</span>
    </button>`).join("")}
    <button class="btn" style="display:block;width:100%;text-align:left" onclick="_pickCust('')"><strong>+ 新しいお客様として登録</strong><br><span style="font-size:12px;color:var(--muted)">上のどのお客様とも別人の場合</span></button>
    <div class="m-foot"><button class="btn" onclick="closeModal()">保存を中止</button></div>`);
}
/* 保存前にダブルブッキングを検知。重複時は確認してから保存する */
function saveApptWithCheck(v, id){
  const doSave = () => {
    v.name = (v.name || "").trim();
    resolveCustomer(v, (cust, isNewCust) => {
      v.customerId = cust.id;
      if(id){ const a = S.appts.find(x => x.id === id); if(a) Object.assign(a, v); }
      else S.appts.push({id: uid(), status:"open", ...v});
      save(); toast((id ? "更新しました" : "予約を追加しました") + (isNewCust ? `。${v.name}様のカルテを新規作成しました` : "")); render();
    });
  };
  const c = apptConflict(v, id);
  if(c) ask(`${staffName(v.staffId)}は ${fmtDate(c.date)} ${c.time}〜「${c.name}様」(${num(c.dur) || 60}分)の予約と時間帯が重複します。このまま保存しますか?`, doSave);
  else doSave();
}
window.addAppt = function(){
  openForm({ title:"予約を追加", fields: apptFields(),
    onsave: v => saveApptWithCheck(v, null) });
};
window.editAppt = function(id){
  const a = S.appts.find(x => x.id === id); if(!a) return;
  /* 紐づいたカルテのフリガナ・電話をフォームに補完表示する */
  const cust = S.customers.find(x => x.id === a.customerId) || S.customers.find(x => x.name === a.name);
  openForm({ title:"予約を編集", fields: apptFields(), data: {...a, kana: a.kana || (cust ? cust.kana : ""), phone: a.phone || (cust ? cust.phone : "")},
    onsave: v => saveApptWithCheck(v, id) });
};
window.delAppt = function(id){

/* 予約の行タップで操作メニューを開く(スマホでは右端のボタンが見えないため)。ボタン自体のタップは素通し */
window.apptRowTap = function(ev, id){
  if(ev.target.closest("button") || ev.target.closest("a")) return;
  const a = S.appts.find(x => x.id === id); if(!a) return;
  const [lbl] = APPT_STATUS[a.status] || APPT_STATUS.open;
  openModal(`<h3>${esc(a.time)} ${esc(a.name)} 様 <span class="h2-sub">${esc(a.menu || "")} ・ ${lbl}</span></h3>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${a.status === "open" ? `<button class="btn pri" onclick="closeModal();checkinAppt('${a.id}')">来店処理(会計)</button>

/* ---- 明細型レジ(来店処理) ----
   予約のメニューを1行目に入れた状態で開き、当日追加のメニューは料金表ボタンのタップや
   自由入力で何行でも足せる。行ごとに担当・単価・個数を変更できる。 */
let REG = null; // {apptId, name, lines:[{name,staffId,price,qty}], pay, tendered, note, nextDate, nextTime, catTab}
window.checkinAppt = function(id){
  const a = S.appts.find(x => x.id === id); if(!a) return;
  _formImg = {}; // 前回の施術写真バッファが次の会計に紛れ込まないように
  REG = { apptId: id, name: a.name, pay: "現金", tendered: "", note: "", nextDate: "", nextTime: "", catTab: "all",
    lines: [{ name: a.menu || "", staffId: a.staffId || "", price: num(a.price), qty: 1 }] };
  renderRegister();
};
const regQtyOf = l => Math.max(1, num(l.qty) || 1);
function regTotal(){ return REG.lines.reduce((a, l) => a + num(l.price) * regQtyOf(l), 0); }
/* 再描画前に、入力中の値をREGへ退避する(タブ切替や行追加でも入力が消えないように) */
function regCapture(){
  if(!REG) return;
  const g = id => { const el = $(id); return el ? el.value : null; };
  ["note", "tendered", "nextDate", "nextTime", "pay"].forEach((k, i) => {
    const v = g(["reg-note", "reg-tender", "reg-nd", "reg-nt", "reg-pay"][i]);
    if(v !== null) REG[k] = v;
  });
  REG.lines.forEach((l, i) => {
    if($("reg-nm-" + i)) l.name = $("reg-nm-" + i).value;
    if($("reg-pr-" + i)) l.price = $("reg-pr-" + i).value;
    if($("reg-st-" + i)) l.staffId = $("reg-st-" + i).value;
  });
}
window.regTab = c => { regCapture(); REG.catTab = c; renderRegister(); };
window.regAddMenu = function(menuId){
  regCapture();
  const mn = S.menus.find(x => x.id === menuId); if(!mn) return;
  /* 同じメニューを再タップしたら個数+1。空の1行目(予約メニューなし)があればそこへ入れる */
  const ex = REG.lines.find(l => l.name === mn.name);
  const blank = REG.lines.find(l => !(l.name || "").trim() && !num(l.price));
  if(ex) ex.qty = regQtyOf(ex) + 1;
  else if(blank) Object.assign(blank, { name: mn.name, price: num(mn.price), qty: 1 });
  else REG.lines.push({ name: mn.name, staffId: (REG.lines[0] || {}).staffId || "", price: num(mn.price), qty: 1 });
  renderRegister();
};
/* 店販商品(在庫管理)からの追加。売価は販売価格(未設定なら参考単価)、確定時にその商品の在庫を減算する */
window.regAddRetail = function(invId){
  regCapture();
  const it = S.inv.find(x => x.id === invId); if(!it) return;
  const price = num(it.sell) > 0 ? num(it.sell) : num(it.price);
  const ex = REG.lines.find(l => l.invId === invId);
  const blank = REG.lines.find(l => !(l.name || "").trim() && !num(l.price));
  if(ex) ex.qty = regQtyOf(ex) + 1;
  else if(blank) Object.assign(blank, { name: it.name, price, qty: 1, invId });
  else REG.lines.push({ name: it.name, staffId: (REG.lines[0] || {}).staffId || "", price, qty: 1, invId });
  renderRegister();
};
window.regAddFree = function(){
  regCapture();
  const name = ($("reg-fname").value || "").trim(), price = num($("reg-fprice").value);
  if(!name){ toast("追加するメニュー名を入れてください"); return; }
  REG.lines.push({ name, staffId: (REG.lines[0] || {}).staffId || "", price, qty: 1 });
  renderRegister();
};
window.regDel = function(i){
  regCapture(); REG.lines.splice(i, 1);
  if(!REG.lines.length) REG.lines.push({ name: "", staffId: "", price: 0, qty: 1 });
  renderRegister();
};
window.regQty = function(i, d){ regCapture(); const l = REG.lines[i]; l.qty = Math.max(1, regQtyOf(l) + d); renderRegister(); };
/* 単価・預かり金の入力中は再描画せず、金額・現計・お釣りだけを更新する */
window.regSums = function(){
  REG.lines.forEach((l, i) => { const el = $("reg-amt-" + i); if(el) el.textContent = yen(num(l.price) * regQtyOf(l)); });
  const t = regTotal();
  if($("reg-total")) $("reg-total").textContent = yen(t);
  const tenderEl = $("reg-tender");
  const tender = tenderEl ? num(tenderEl.value) : 0;
  if($("reg-change")) $("reg-change").innerHTML = tender > 0
    ? (tender >= t ? `お釣り <strong style="font-size:18px;color:var(--good)">${yen(tender - t)}</strong>` : `<span style="color:var(--crit)">不足 ${yen(t - tender)}</span>`)
    : "";
};

        ];
        return btns.length ? btns.join("")
          : `<span class="hint">メニュー料金表・在庫の「店販商品」が未登録です。登録するとここにタップで追加できるボタンが並びます(下の自由入力からも追加できます)。</span>`;
      })()}
    </div>
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center">
      <input id="reg-fname" placeholder="自由入力(店販・特別対応など)" style="max-width:200px">
      <input id="reg-fprice" type="number" inputmode="numeric" min="0" placeholder="金額" style="max-width:100px;text-align:right">
      <button class="btn sm" onclick="regAddFree()">+ 行を追加</button>
    </div>
    <div class="reg-sum">

      <div class="f-2col" style="margin-top:10px">
        <div class="f-row"><label for="reg-pay">支払方法</label><select id="reg-pay">${PAY_METHODS.map(p => `<option ${REG.pay === p ? "selected" : ""}>${p}</option>`).join("")}</select></div>
        <div class="f-row"><label for="reg-tender">お預かり(円)</label><input id="reg-tender" type="number" inputmode="numeric" min="0" value="${esc(REG.tendered || "")}" oninput="regSums()"></div>

/* 会計の中断確認。誤タップで明細が消えるのを防ぐ(「入力へ戻る」で元の内容に復帰) */
window.regAskClose = function(){
  regCapture();
  if(!REG || (REG.lines.length <= 1 && !(REG.lines[0] && (REG.lines[0].name || "").trim()))){ closeModal(); return; }
  openModal(`<h3>会計を中断しますか?</h3><p style="font-size:13.5px">入力した明細は保存されません。</p>
    <div class="m-foot"><button class="btn" onclick="renderRegister()">入力へ戻る</button>
    <button class="btn danger" onclick="closeModal()">中断する</button></div>`);
  _dismiss = renderRegister; // 確認画面で背景タップ・Escした場合も入力へ戻す
};
window.regConfirm = function(){
  regCapture();
  const a = S.appts.find(x => x.id === REG.apptId); if(!a) return;
  const lines = REG.lines
    .map(l => ({ name: (l.name || "").trim(), staffId: l.staffId, price: num(l.price), qty: regQtyOf(l), invId: l.invId || "" }))
    .filter(l => l.name && l.price > 0);
  if(!lines.length){ toast("メニュー名と金額を入れてください"); return; }
  /* カルテの特定を先に行う(未紐づけの旧予約で同姓同名がいる場合は選択画面が出る) */
  const finish = c => {
    a.status = "done";
    a.customerId = c.id;
    /* 複数明細は同じ会計(saleId)として記録し、客数・客単価は1会計=1客で数える。
       料金表メニューは集計カテゴリへ解決して売上計上、カルテにはメニュー名のまま残す。
       店販商品(invIdつき)は「店販(商品売上)」で計上し、その商品の在庫を個数分減算する */
    const saleId = uid();
    let used = [];
    lines.forEach(l => {
      const cat = l.invId ? "店販(商品売上)" : menuCat(l.name);
      S.tx.push({id: uid(), saleId, type:"income", date: a.date, category: cat, amount: l.price * l.qty,
        memo: `${a.name}様${l.qty > 1 ? `(${l.name}×${l.qty})` : ""}`, staffId: l.staffId, pay: REG.pay});
      if(l.invId){
        const it = S.inv.find(x => x.id === l.invId);
        if(it){ it.qty = Math.max(0, num(it.qty) - l.qty); used.push(it.name); }
      } else {
        for(let k = 0; k < l.qty; k++) used = used.concat(consumeInv(cat));
      }
    });
    const total = lines.reduce((x, l) => x + l.price * l.qty, 0);
    c.visits.push({id: uid(), date: a.date, menu: lines.map(l => l.qty > 1 ? `${l.name}×${l.qty}` : l.name).join(" + "),
      staffId: lines[0].staffId, price: total, note: REG.note, img: _formImg.regimg || ""});
    let msg = "会計を記録し、カルテに反映しました";
    if(REG.nextDate){
      const nid = uid();
      S.appts.push({id: nid, date: REG.nextDate, time: REG.nextTime || "10:00", name: a.name, customerId: c.id, menu: lines[0].name,
        staffId: lines[0].staffId, price: total, status:"open", dur: a.dur || 60, nominated: a.nominated || "", memo:"次回予約"});
      a.nextApptId = nid;
      msg += `。次回予約 ${fmtDate(REG.nextDate)} を登録しました`;
    }
    if(used.length) msg += `(在庫減算: ${used.join("、")})`;
    closeModal(); save(); toast(msg); render();
  };
  const byId = S.customers.find(x => x.id === a.customerId);
  if(byId) finish(byId);
  else resolveCustomer({ name: a.name, kana: "", phone: "" }, finish);
};
/* ================= register closing (レジ締め) ================= */
window.closeNav = d => { V.closeDate = addDays(V.closeDate, d); render(); };
window.closeToday = () => { V.closeDate = todayStr(); render(); };
const DENOMS = [10000, 5000, 2000, 1000, 500, 100, 50, 10, 5, 1];
let _cashSales = 0; // 表示中日付の現金売上(過不足のライブ計算用)
VIEWS.closing = function(){
  const d = V.closeDate;
  const inc = S.tx.filter(t => t.type === "income" && t.date === d);
  const exp = S.tx.filter(t => t.type === "expense" && t.date === d && !t.ownerDraw);

  const totInc = inc.reduce((a,t) => a + num(t.amount), 0), totExp = exp.reduce((a,t) => a + num(t.amount), 0);
  const c = S.closings[d] || {};
  _cashSales = byPay["現金"].v;
  const closed = !!c.closed;
  const cntInput = (key, dn) => `<input type="number" inputmode="numeric" min="0" step="1" id="cl-${key}-${dn}" value="${((key === "f" ? c.floatCnt : c.actualCnt) || {})[dn] || ""}" oninput="recalcCash()" style="max-width:88px;text-align:right" aria-label="${dn}円 ${key === "f" ? "釣銭準備金" : "レジ内実査"} 枚数">`;
  $("main").innerHTML =
    pageHead("レジ締め(日計)", "1日の売上を支払方法別に集計し、レジ現金を照合します",
      `<span class="mnav"><button class="btn sm" onclick="closeNav(-1)" aria-label="前日">‹</button><span class="mn-label">${fmtDate(d)}</span><button class="btn sm" onclick="closeNav(1)" aria-label="翌日">›</button></span><button class="btn sm" onclick="closeToday()">今日</button>`) +
    `<div class="card"><h2>支払方法別売上 ${closed ? '<span class="chip good">締め済</span>' : '<span class="chip warn">未締め</span>'}</h2>
      <div class="twrap"><table>
        <tr><th>支払方法</th><th class="num">件数</th><th class="num">金額</th></tr>
        ${PAY_METHODS.map(p => `<tr><td>${p}</td><td class="num">${byPay[p].n}件</td><td class="num">${yen(byPay[p].v)}</td></tr>`).join("")}
        <tr class="total"><td>合計</td><td class="num">${inc.length}件</td><td class="num">${yen(totInc)}</td></tr>
      </table></div>
      <div class="hint">支払方法が未設定の売上は現金として集計します。当日の支出: ${yen(totExp)}(${exp.length}件)</div>
    </div>
    <div class="card"><h2>現金照合(金種表) <span class="h2-sub">枚数を入れると合計金額が自動計算されます</span></h2>
      <div class="twrap"><table style="max-width:520px">
        <tr><th>金種</th><th class="num">釣銭準備金(枚)</th><th class="num">レジ内実査(枚)</th></tr>
        ${DENOMS.map(dn => `<tr>
          <td style="white-space:nowrap;font-variant-numeric:tabular-nums">${dn.toLocaleString("ja-JP")}円${dn >= 1000 ? "札" : "玉"}</td>
          <td class="num">${cntInput("f", dn)}</td>
          <td class="num">${cntInput("a", dn)}</td>
        </tr>`).join("")}
      </table></div>
      <div class="f-2col" style="max-width:520px;margin-top:14px">
        <div class="f-row"><label for="cl-float">釣銭準備金 合計(円)</label><input id="cl-float" type="number" inputmode="numeric" min="0" value="${c.float ?? ""}" oninput="updateCashLive()"></div>
        <div class="f-row"><label for="cl-actual">レジ内実査額 合計(円)</label><input id="cl-actual" type="number" inputmode="numeric" min="0" value="${c.actual ?? ""}" oninput="updateCashLive()"></div>

    </div>`;

/* 金種の枚数から合計金額を計算して合計欄へ反映 */
window.recalcCash = function(){
  let f = 0, a = 0;
  DENOMS.forEach(dn => {
    f += dn * Math.max(0, num($("cl-f-" + dn).value));
    a += dn * Math.max(0, num($("cl-a-" + dn).value));
  });
  $("cl-float").value = f || "";
  $("cl-actual").value = a || "";
  updateCashLive();
};
/* 理論在高と過不足を入力のたびに再計算して表示 */
window.updateCashLive = function(){
  const el = $("cl-live"); if(!el) return;
  const theo = num($("cl-float").value) + _cashSales;
  let diffHtml = "";
  if($("cl-actual").value !== ""){
    const diff = num($("cl-actual").value) - theo;
    diffHtml = ` ・ 過不足: <strong style="color:${diff === 0 ? "var(--good)" : "var(--crit)"}">${diff > 0 ? "+" : diff < 0 ? "−" : "±"}${yen(Math.abs(diff))}</strong>`;
  }
  el.innerHTML = `理論在高(釣銭準備金+現金売上 ${yen(_cashSales)}): <strong>${yen(theo)}</strong>${diffHtml}`;
};
window.saveClosing = function(){
  const cnt = key => {
    const o = {};
    DENOMS.forEach(dn => { const n = Math.max(0, num($(`cl-${key}-${dn}`).value)); if(n) o[dn] = n; });
    return o;
  };
  S.closings[V.closeDate] = { float: num($("cl-float").value), actual: num($("cl-actual").value),
    floatCnt: cnt("f"), actualCnt: cnt("a"), memo: $("cl-memo").value, closed: true };
  save(); toast("レジ締めを保存しました"); render();
};

function ticketFields(){
  return [
    {key:"customerId", label:"お客様", type:"select", required:true, blank:"(選択してください)", options: S.customers.map(c => [c.id, c.name])},

    {key:"total", label:"回数", type:"number", value:5, required:true, min:1, half:true},
    {key:"price", label:"販売価格(円)", type:"number", min:0, half:true},
    {key:"date", label:"販売日", type:"date", value: todayStr(), half:true},

window.addTicket = function(){
  if(!S.customers.length){ toast("先に顧客カルテでお客様を登録してください"); return; }
  openForm({ title:"回数券を販売", fields: ticketFields(),
    onsave: v => {
      const {book, pay, ...t} = v;
      S.tickets.push({id: uid(), used: 0, ...t});
      if(book === "yes" && num(t.price) > 0){
        const cn = (S.customers.find(c => c.id === t.customerId) || {}).name || "";
        S.tx.push({id: uid(), type:"income", date: t.date || todayStr(), category:"その他収入", amount: num(t.price), memo:`回数券販売: ${t.name}(${cn}様)`, staffId:"", pay});
      }
      save(); toast(book === "yes" ? "販売し、売上にも計上しました" : "販売を記録しました"); render();
    } });
};
window.editTicket = function(id){
  const t = S.tickets.find(x => x.id === id); if(!t) return;
  const fs = ticketFields().filter(f => f.key !== "book" && f.key !== "pay");
  openForm({ title:"回数券を編集", fields: fs, data: t,
    onsave: v => { Object.assign(t, v); t.used = Math.min(num(t.used), num(t.total)); save(); toast("更新しました"); render(); } });
};
window.delTicket = function(id){
  ask("この回数券を削除しますか?", () => { S.tickets = S.tickets.filter(x => x.id !== id); save(); toast("削除しました"); render(); });
};
window.useTicket = function(id){
  const t = S.tickets.find(x => x.id === id); if(!t) return;
  const left = num(t.total) - num(t.used);
  if(left <= 0){ toast("この回数券は消化済です"); return; }
  t.used = num(t.used) + 1;
  save(); toast(`1回消化しました(残り${left - 1}回)`); render();
};

window.saveBulk = function(){
  const months = lastMonths(V.bulkN + 1, thisMonth()).slice(0, -1);
  let changed = 0;
  months.forEach(m => {
    [["bi", "income"], ["be", "expense"]].forEach(([p, type]) => {
      const el = $(`${p}-${m}`); if(!el) return;
      const val = Math.max(0, num(el.value));
      const existing = S.tx.filter(t => t.bulk && t.type === type && t.date && t.date.startsWith(m));
      const existAmt = existing.reduce((a,t) => a + num(t.amount), 0);
      if(val === existAmt) return;
      S.tx = S.tx.filter(t => !(t.bulk && t.type === type && t.date && t.date.startsWith(m)));
      if(val > 0) S.tx.push(type === "income"
        ? {id: uid(), bulk: true, type, date: m + "-15", category: "過去実績", amount: val, memo: "まとめ入力", staffId: "", pay: "その他"}
        : {id: uid(), bulk: true, type, date: m + "-15", category: "過去実績", amount: val, memo: "まとめ入力", staffId: "", taxRate: "10"});
      changed++;

/* ================= tax estimate (納税予想) =================
   個人事業主(美容業)向けの概算。前提は設定カードで変更できる。
   - 事業のもうけ = アプリの利益(売上 − 経費 − 給料。計上済み給与の二重引きは除外)をそのまま使う
   - 所得税: 青色申告特別控除・社会保険料等・基礎控除58万円を引いた課税所得に累進税率、復興特別所得税2.1%込み
   - 住民税: 基礎控除43万円・税率10% + 均等割5,000円(森林環境税含む)
   - 個人事業税: 美容業は第3種(5%)。青色控除は適用されないため控除前の利益から事業主控除290万円を引く
   - 消費税(簡易課税): 美容の技術売上は第5種(納付50%)、店販売上は第2種(納付20%)。売上は税込・税率10%前提
   いずれも千円未満切捨て(課税所得)・100円未満切捨て(税額)で概算する */
const taxCfg = () => {
  const t = Object.assign({ type: "blue65", ct: "kanni", ctFrom: 2027, deds: {} }, S.settings.tax || {});
  t.deds = Object.assign({}, t.deds || {});
  /* 旧形式(社保・その他の2欄)で保存済みの場合は品目別へ引き継ぐ */
  if(num(t.ins) > 0 && !num(t.deds.shakai)) t.deds.shakai = num(t.ins);
  if(num(t.other) > 0 && !num(t.deds.sonota)) t.deds.sonota = num(t.other);
  return t;
};
/* 所得控除の品目 [key, 名称, 説明, 控除額の上限(0=上限なし)] */
const DED_ITEMS = [
  ["shakai", "社会保険料控除", "国民健康保険・国民年金などの年間支払額。全額引けます", 0],
  ["kyosai", "小規模企業共済・iDeCo", "掛金の年間合計。全額引けます", 0],
  ["seimei", "生命保険料控除", "上限12万円(超えた分は自動で12万円に丸めます)", 120000],
  ["jishin", "地震保険料控除", "上限5万円", 50000],
  ["haigu", "配偶者控除・配偶者特別控除", "一般は38万円(配偶者の収入により変動)。給料を払っている家族(専従者)は対象外", 0],
  ["fuyo", "扶養控除", "扶養家族1人につき38万円(19〜22歳は63万円)の合計。給料を払っている家族(専従者)は対象外", 0],
  ["iryo", "医療費控除", "支払った医療費 − 保険金 − 10万円", 0],
  ["kifu", "寄附金控除", "ふるさと納税など: 寄附額 − 2,000円", 0],
  ["sonota", "その他の所得控除", "上記にない控除があれば合計額を", 0]
];
const dedTotal = cfg => DED_ITEMS.reduce((a, [k, , , cap]) => {
  let v = Math.max(0, num((cfg.deds || {})[k]));
  if(cap) v = Math.min(v, cap);
  return a + v;
}, 0);
/* その年に消費税を納めるか。ctFrom = 課税事業者になる年(開業からの免税期間は納付なし) */
const ctActive = (cfg, yr) => cfg.ct !== "none" && (!num(cfg.ctFrom) || yr >= num(cfg.ctFrom));
/* その年の 売上・店販売上・利益・事業主の給料 の合計(データのある月まで)。
   事業主(owner)の給料は経費にできないため、税金計算ではprofitに足し戻して使う */
function yearTaxBase(yr){
  const cur = thisMonth();
  let inc = 0, retail = 0, profit = 0, ownerPay = 0;
  for(let i = 1; i <= 12; i++){
    const m = yr + "-" + String(i).padStart(2, "0");
    if(m > cur) break; // 未来の月は月給スタッフの給料だけ乗ってしまうため含めない
    const s = monthSummary(m);
    inc += s.inc; retail += s.retail; profit += s.profit;
    S.staff.filter(st => st.owner === "1" && staffActiveIn(st, m)).forEach(st => { ownerPay += calcPay(st, m).total; });
  }
  return { inc, retail, profit, ownerPay };
}
/* 所得税+住民税の共通計算(個人事業主の事業所得にも、法人の役員報酬にも使う)。
   base = 控除前の所得、ded = 所得控除の合計(基礎控除は含まない)、jutaku = 住宅ローン控除(税額控除) */
function personalTaxes(base, ded, jutaku){
  const flr = (v, u) => Math.floor(Math.max(0, v) / u) * u;
  /* 所得税: 課税所得 × 累進税率 − 住宅ローン控除、残りに復興特別所得税2.1% */
  const taxable = flr(base - ded - 580000, 1000);
  const br = [[1949000,.05,0],[3299000,.10,97500],[6949000,.20,427500],[8999000,.23,636000],[17999000,.33,1536000],[39999000,.40,2796000],[Infinity,.45,4796000]];
  const [, rate, quick] = br.find(x => taxable <= x[0]);
  let itBase = Math.max(0, taxable * rate - quick);
  const jtIT = Math.min(itBase, jutaku);
  itBase -= jtIT;
  const shotoku = flr(itBase * 1.021, 100);
  /* 住民税(所得割10% + 均等割5,000円)。住宅ローン控除の引き切れない分は最大97,500円まで住民税からも引ける */
  const taxableJu = flr(base - ded - 430000, 1000);
  let juIncome = taxableJu > 0 ? flr(taxableJu * 0.10, 100) : 0;
  const jtJu = Math.min(Math.max(0, jutaku - jtIT), 97500, juIncome);
  juIncome -= jtJu;
  const jumin = taxableJu > 0 ? juIncome + 5000 : 0;
  return { taxable, shotoku, jumin, jutakuUsed: jtIT + jtJu };
}
function calcTaxes(b, cfg, yr){
  const flr = (v, u) => Math.floor(Math.max(0, v) / u) * u;
  const blue = cfg.type === "blue65" ? 650000 : cfg.type === "blue55" ? 550000 : cfg.type === "blue10" ? 100000 : 0;
  const blueUsed = Math.min(blue, Math.max(0, b.profit)); // 控除は利益が上限(マイナスにはならない)
  const biz = Math.max(0, b.profit) - blueUsed;           // 青色控除後の事業所得
  const ded = dedTotal(cfg);
  const jutaku = Math.max(0, num((cfg.deds || {}).jutaku)); // 住宅ローン控除(税額控除: 税金そのものから引く)
  const p = personalTaxes(biz, ded, jutaku);
  /* 個人事業税(美容業=第3種5%、事業主控除290万円、青色控除は引かない) */
  const jigyo = flr(Math.max(0, b.profit - 2900000) * 0.05, 100);
  /* 消費税(開業からの免税期間は納付なし) */
  let shohi = 0;
  const exempt = !ctActive(cfg, yr);
  if(!exempt){
    if(cfg.ct === "kanni"){ const svc = Math.max(0, b.inc - b.retail); shohi = svc * 10 / 110 * 0.5 + b.retail * 10 / 110 * 0.2; }
    else if(cfg.ct === "2wari"){ shohi = b.inc * 10 / 110 * 0.2; }
    shohi = flr(shohi, 100);
  }
  return { blueUsed, biz, ded, jutakuUsed: p.jutakuUsed, taxable: p.taxable, shotoku: p.shotoku, jumin: p.jumin, jigyo, shohi, exempt, total: p.shotoku + p.jumin + jigyo + shohi };
}
/* ---- 法人にした場合の比較(概算) ----
   中小法人(資本金1億円以下)・協会けんぽ加入・役員1名(本人)を想定。
   - 会社の利益 = 事業の利益 − 役員報酬 − 社会保険の会社負担分
   - 法人側の税金: 法人税(800万円以下15%/超23.2%)+地方法人税(法人税×10.3%)
     +法人住民税(法人税×約7%+均等割7万円)+法人事業税(3.5〜7%)+特別法人事業税(事業税×37%)
   - 個人側: 役員報酬に給与所得控除(最低65万円)を適用して所得税・住民税
   - 社会保険: 健康保険約11.5%+厚生年金18.3%を会社と本人で折半(標準報酬の上限を考慮)
   - 消費税は比較に含めない(新設法人は条件を満たせば約2年免税のため) */
function corpCompare(profit, cfg){
  const moAuto = Math.max(100000, Math.floor(Math.max(0, profit) / 2 / 12 / 10000) * 10000);
  const mo = num(cfg.corpY) > 0 ? num(cfg.corpY) : moAuto;
  const Y = mo * 12;
  const shahoTotal = Math.round(12 * (Math.min(mo, 650000) * 0.183 + Math.min(mo, 1390000) * 0.115));
  const shahoHalf = Math.round(shahoTotal / 2);
  const C = profit - Y - shahoHalf; // 会社に残る利益(役員報酬と会社負担の社保を経費にした後)
  let corpTax = 70000; // 法人住民税の均等割(赤字でもかかる)
  if(C > 0){
    const hojin = Math.min(C, 8e6) * 0.15 + Math.max(0, C - 8e6) * 0.232;
    const jigyo = Math.min(C, 4e6) * 0.035 + Math.min(Math.max(C - 4e6, 0), 4e6) * 0.053 + Math.max(0, C - 8e6) * 0.07;
    corpTax += hojin * 1.103 + hojin * 0.07 + jigyo * 1.37;
  }
  corpTax = Math.floor(corpTax / 100) * 100;
  /* 役員個人: 給与所得控除(2025年改正: 最低65万円)後に所得税・住民税。
     国保・年金(社会保険料控除の入力値)は厚生年金・健康保険に置き換わるため除外し、本人負担分の社保を控除する */
  const kyuyoDed = Y <= 1900000 ? Math.max(650000, Y * 0.4 - 100000)
    : Y <= 3600000 ? Y * 0.3 + 80000
    : Y <= 6600000 ? Y * 0.2 + 440000
    : Y <= 8500000 ? Y * 0.1 + 1100000 : 1950000;
  const dedEx = dedTotal(cfg) - Math.max(0, num((cfg.deds || {}).shakai));
  const jutaku = Math.max(0, num((cfg.deds || {}).jutaku));
  const p = personalTaxes(Y - kyuyoDed, shahoHalf + dedEx, jutaku);
  return { mo, moAuto, Y, C, corpTax, shahoTotal, shahoHalf, personal: p, total: corpTax + p.shotoku + p.jumin + shahoTotal };
}
window.saveCorpY = function(){

VIEWS.tax = function(){
  const yr = V.taxYear, curYr = +todayStr().slice(0, 4);
  const isCur = yr === curYr, cfg = taxCfg();
  const act = yearTaxBase(yr);
  /* 利益は「売上−経費−従業員給料」で、事業主の給料は最初から引いていない(=そのまま税金計算のもうけ) */
  const mkBase = f => ({ inc: f(act.inc), retail: f(act.retail), book: f(act.profit), ownerPay: f(act.ownerPay), profit: f(act.profit) });
  const actB = mkBase(v => v);
  const actT = calcTaxes(actB, cfg, yr);
  /* 今年は「年末までこのペース」の見込みも出す(経過日数で年換算。2週間未満はブレが大きいので出さない) */
  const doy = Math.round((new Date(curYr, +todayStr().slice(5,7) - 1, +todayStr().slice(8)) - new Date(curYr, 0, 1)) / 86400000) + 1;
  const diy = (curYr % 4 === 0 && (curYr % 100 !== 0 || curYr % 400 === 0)) ? 366 : 365;
  const canProj = isCur && doy >= 14 && act.inc > 0;
  const projB = canProj ? mkBase(v => Math.round(v / doy * diy)) : null;
  const projT = projB ? calcTaxes(projB, cfg, yr) : null;
  const mainB = projB || actB;

        データはこの端末・ブラウザの中だけに保存されます(IndexedDB方式。施術写真・領収書写真もたっぷり保存できます)。機種変更やブラウザのデータ削除に備えて、定期的にバックアップファイルを保存してください。<br>
        現在の使用量: 約${kb}${_lsMode ? "(この環境は簡易保存モード・上限約5MB)" : ` ・ 保存できる残り容量の目安: <span id="quota-est">計算中…</span>`}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn pri" onclick="exportBackup()">バックアップを書き出す(JSON)</button>
        <label class="btn" style="cursor:pointer">バックアップを読み込む<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></label>
      </div>
    </div>
    <div class="card"><h2>スマホでアプリのように使う</h2>
      <p style="font-size:13px;color:var(--ink2);margin-bottom:4px">ブラウザの「ホーム画面に追加」を使うと、ホーム画面のアイコンからアプリのように起動できます。</p>
      <ul style="font-size:13px;color:var(--ink2);padding-left:20px">
        <li><strong>iPhone(Safari)</strong>: 共有ボタン(□↑)→「ホーム画面に追加」</li>
        <li><strong>Android(Chrome)</strong>: メニュー(⋮)→「ホーム画面に追加」</li>
      </ul>
    </div>
    <div class="card"><h2>過去実績のまとめ入力</h2>
      <p style="font-size:13px;color:var(--ink2);margin-bottom:10px">
        使い始める前の月の売上・経費を、1日ずつではなく<strong>月ごとの合計</strong>でまとめて登録できます。グラフや前年対比にすぐ反映されます。</p>
      <button class="btn pri" onclick="openBulk()">まとめ入力画面を開く</button>
    </div>
    <div class="card"><h2>お試し</h2>
      <p style="font-size:13px;color:var(--ink2);margin-bottom:10px">動作を確認したいときはサンプルデータを投入できます(既存データはそのまま残ります)。</p>
      <button class="btn" onclick="seedSample()">サンプルデータを投入</button>
    </div>
    <div class="card"><h2 style="color:var(--crit)">データの初期化</h2>
      <button class="btn danger" onclick="wipeAll()">全データを削除</button>
    </div>`;
  /* 残り容量の目安(対応ブラウザのみ)。数百MB〜数GBが一般的 */
  try{
    if(!_lsMode && navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(est => {
      const el = $("quota-est"); if(!el || !est || !est.quota) return;
      const free = Math.max(0, est.quota - (est.usage || 0));
      el.textContent = free >= 1073741824 ? (free/1073741824).toFixed(1) + "GB" : Math.round(free/1048576).toLocaleString() + "MB";
    }).catch(() => {});
  }catch(e){}
};
window.saveSettings = function(){
  S.settings.name = $("set-name").value || "マイサロン";
  S.settings.target = Math.max(0, num($("set-target").value));
  S.settings.minWage = Math.max(0, num($("set-minwage").value));
  save(); toast("保存しました"); render();
};
/* 締日・支払日の選択肢: 1〜28日+末日(29〜31日は月により存在しないため末日として扱う) */
function payDayOptions(sel){
  return Array.from({length: 28}, (_, i) => i + 1).map(d => `<option value="${d}" ${sel === d ? "selected" : ""}>${d}日</option>`).join("")
    + `<option value="31" ${sel >= 29 ? "selected" : ""}>末日</option>`;
}
window.savePaySchedule = function(){
  S.settings.payClose = num($("set-pc").value) || 20;
  S.settings.payDay = num($("set-pd").value) || 25;
  S.settings.payMonth = $("set-pm").value === "next" ? "next" : "same";
  save(); toast(`給与を${payCloseLabel()}締め・${payDayLabel()}払いに設定しました`); render();
};
window.saveClosedWd = function(){
  const wd = WD.map((_, i) => i).filter(i => { const el = $("cwd-" + i); return el && el.checked; });
  if(wd.length === 7){ toast("すべての曜日を定休日にはできません"); render(); return; }
  S.settings.closedWd = wd;
  save(); toast(wd.length ? `定休日を${wd.map(i => WD[i]).join("・")}曜日にしました` : "定休日なしにしました"); render();
};
window.addClosedDate = function(){
  const d = $("set-cd").value;
  if(!d){ toast("日付を選択してください"); return; }
  S.settings.closedDates = S.settings.closedDates || [];
  if(S.settings.closedDates.includes(d)){ toast("その日はすでに臨時休業に登録されています"); return; }
  S.settings.closedDates.push(d); S.settings.closedDates.sort();
  save(); toast(`${fmtDate(d)}を臨時休業にしました`); render();
};
window.delClosedDate = function(d){
  S.settings.closedDates = (S.settings.closedDates || []).filter(x => x !== d);
  save(); toast("削除しました"); render();
};
/* 対象月を変えたら、その月の設定済み目標を金額欄へ反映(編集しやすく) */
window.monthTargetPick = function(){
  const mm = $("set-tm").value, el = $("set-tma");
  if(!el) return;
  const v = num((S.settings.targets || {})[mm]);
  el.value = v > 0 ? v : "";
};
window.saveMonthTarget = function(){
  const mm = $("set-tm").value;
  if(!mm){ toast("対象月を選択してください"); return; }
  const v = Math.max(0, num($("set-tma").value));
  S.settings.targets = S.settings.targets || {};
  if(v > 0) S.settings.targets[mm] = v; else delete S.settings.targets[mm];
  save(); toast(v > 0 ? `${fmtMonth(mm)}の目標を${yen(v)}にしました` : `${fmtMonth(mm)}は共通目標に戻しました`); render();
};
window.delMonthTarget = function(mm){
  if(S.settings.targets) delete S.settings.targets[mm];
  save(); toast("削除しました"); render();
};
window.exportBackup = function(){
  S.settings.lastBackup = todayStr(); save();
  dlText(`salon-backup_${todayStr()}.json`, JSON.stringify(S, null, 1), "application/json");
  toast("バックアップを書き出しました");
};
window.importBackup = function(input){
  const file = input.files && input.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!d || typeof d !== "object" || !("tx" in d)) throw 0;
      ask("現在のデータをバックアップの内容で置き換えますか?", () => {
        S = normalizeState(d); save(); toast("読み込みました"); render();
      });
    }catch(e){ toast("読み込めませんでした。バックアップファイルを確認してください"); }
  };
  rd.readAsText(file);
  input.value = ""; // 同じファイルをもう一度選び直せるようにする
};
window.wipeAll = function(){
  ask("すべてのデータを完全に削除します。よろしいですか?(元に戻せません)", () => {
    S = structuredClone(DEFAULTS); save();
    try{ localStorage.removeItem(LS_KEY); }catch(e){} // 移行前の旧データも消す
    toast("初期化しました"); render();
  });
};

/* ================= boot ================= */
(async () => {
  S = await loadState();
  /* ブラウザに保存領域の恒久化を依頼(容量逼迫時の自動削除対象になりにくくする) */
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
  const _recN = applyRecurring();
  render();
  if(_recN) toast(`定期支出${_recN}件を自動計上しました`);
  window.__booted = true; // 自動テスト用: 読み込み完了の合図
})();
</script>
