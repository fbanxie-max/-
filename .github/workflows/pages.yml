# GitHub Pagesへ自動公開: このブランチへのpushごとに index.html を
# https://fbanxie-max.github.io/-/ へデプロイする(localStorageが恒久化される正式URL)
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/salon-management-dashboard-mxsxlm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
