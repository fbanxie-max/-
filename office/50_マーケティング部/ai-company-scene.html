<title>深夜のAIカンパニー — 美容室オーナー×AI</title>
<style>
  :root{
    --void:#140f16; --void2:#0c0810;
    --floor:#241a2b; --floor2:#1b1422; --wall:#1a1320; --line:#3d2f47;
    --ivory:#f6efe9; --mute:#a897a6; --dim:#6b5b6d;
    --rose:#e6a6bd; --rose-deep:#c66f8f; --champ:#ecc79c; --mint:#8fe6c6; --coral:#f0967f;
    --skin:#ecccb4; --hair:#2a2030;
    --r:15px;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;
    --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(120% 80% at 50% -8%,#2b1c30,var(--void) 55%,var(--void2));
    color:var(--ivory);font-family:var(--jp);overflow:hidden;display:grid;place-items:center}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.5}

  .stage{position:relative;z-index:1;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,var(--wall) 0 46%, #150f1c 46% 62%, var(--floor2) 62% 100%);
    box-shadow:0 0 80px rgba(0,0,0,.6)}

  /* ---- HUD ---- */
  .hud{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px 10px;background:linear-gradient(180deg,rgba(12,8,16,.9),transparent)}
  .title{min-width:0}
  .title .t1{font-weight:800;font-size:15px;letter-spacing:.02em;line-height:1.15}
  .title .t2{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--mint);text-transform:uppercase;margin-top:3px}
  .hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .live{display:inline-flex;align-items:center;gap:5px;color:var(--mint);font-weight:800;font-size:10px;letter-spacing:.14em;font-family:var(--mono)}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 9px var(--mint);animation:blink 1.4s infinite}
  .kpis{display:flex;gap:7px}
  .kpi{background:rgba(38,29,46,.7);border:1px solid var(--line);border-radius:9px;padding:3px 9px;text-align:right}
  .kpi .k{font-size:8px;color:var(--mute);letter-spacing:.08em;font-family:var(--mono);text-transform:uppercase}
  .kpi .v{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
  .v.mint{color:var(--mint)} .v.champ{color:var(--champ)}

  /* ---- office ---- */
  .office{position:relative;flex:1;min-height:0;padding:2px 12px 0}
  .neon{position:absolute;top:6px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
  .neon .n1{font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--rose);
    text-shadow:0 0 10px rgba(230,166,189,.7),0 0 22px rgba(198,111,143,.4)}
  .neon .n2{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--champ);opacity:.8;margin-top:2px}

  .boss{position:absolute;top:34px;left:50%;transform:translateX(-50%);z-index:4}
  .grid{position:absolute;left:12px;right:12px;bottom:30px;top:104px;
    display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;align-items:end;justify-items:center}
  .station{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:100%;height:100%;padding-bottom:2px}
  .wk{position:relative;display:flex;flex-direction:column;align-items:center}
  .plate{margin-top:5px;font-size:9.5px;font-weight:800;letter-spacing:.03em;color:var(--ivory);
    background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:20px;padding:2px 10px;white-space:nowrap}
  .plate small{color:var(--mute);font-family:var(--mono);font-weight:400}

  /* worker figure */
  .worker{--c:var(--rose);position:relative;width:52px;height:50px;animation:idle 3.4s ease-in-out infinite}
  .hair{position:absolute;left:13px;top:0;width:26px;height:14px;border-radius:13px 13px 3px 3px;background:var(--hair);z-index:2}
  .head{position:absolute;left:15px;top:5px;width:22px;height:20px;border-radius:9px;background:var(--skin);z-index:1}
  .body{position:absolute;left:9px;top:22px;width:34px;height:26px;border-radius:13px 13px 7px 7px;
    background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 70%,#000));z-index:1}
  .arm{position:absolute;top:25px;width:8px;height:16px;border-radius:5px;background:var(--c);transform-origin:top center;z-index:3}
  .arm.l{left:7px;animation:typeA .5s ease-in-out infinite}
  .arm.r{right:7px;animation:typeB .5s ease-in-out infinite}
  .worker.slow .arm{animation-duration:.9s}
  .worker.cheer .arm.l{animation:cheerL 1s ease}
  .worker.cheer .arm.r{animation:cheerR 1s ease}

  .desk{position:relative;margin-top:-11px;width:76px;height:30px;z-index:2}
  .slab{position:absolute;bottom:0;left:0;width:76px;height:13px;border-radius:5px;
    background:linear-gradient(180deg,#2c2233,#1a1422);border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .mon{position:absolute;bottom:11px;left:23px;width:32px;height:22px;border-radius:4px;background:#0d0912;
    border:1px solid var(--line);overflow:hidden;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
  .mon .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,var(--c),transparent 70%);opacity:.35;animation:flick 2.6s infinite}
  .mon .barz{position:absolute;inset:4px;display:flex;align-items:flex-end;gap:2px}
  .mon .barz i{flex:1;background:var(--c);border-radius:1px;opacity:.85}

  .bubble{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%) scale(.6);z-index:9;
    background:var(--ivory);color:#241a2b;font-size:10px;font-weight:700;line-height:1.3;
    padding:5px 9px;border-radius:11px;white-space:nowrap;opacity:0;pointer-events:none;
    box-shadow:0 6px 16px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;max-width:150px}
  .bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--ivory)}
  .bubble.show{opacity:1;transform:translateX(-50%) scale(1)}

  /* boss slightly bigger, points */
  .boss .worker{width:58px;height:56px}
  .boss .arm.r{animation:point 2.2s ease-in-out infinite}
  .boss .arm.l{animation:none;transform:rotate(6deg)}

  /* runner carrying a doc along the floor */
  .runner{position:absolute;bottom:7px;left:0;z-index:8;display:flex;align-items:flex-end;gap:1px;
    animation:run 9s linear infinite;filter:drop-shadow(0 3px 7px rgba(0,0,0,.55))}
  .runner .doc{font-size:16px;filter:drop-shadow(0 0 7px rgba(236,199,156,.9));align-self:center;margin-bottom:11px}
  .runner .worker{width:40px;height:40px;animation:hop .5s ease-in-out infinite}
  .runner .worker .arm{animation:swing .5s ease-in-out infinite;background:var(--champ)}
  .runner .body{background:var(--champ)!important}
  .runner .head{background:#f0d8c2} .runner .hair{background:#3a2a3c}

  /* ---- phone / post ---- */
  .phone{flex:0 0 auto;margin:0 12px 10px;background:linear-gradient(180deg,#221a29,#160f1d);
    border:1px solid var(--line);border-radius:16px;padding:11px 13px;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
  .p-app{display:flex;align-items:center;gap:8px}
  .p-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,var(--rose-deep),var(--champ));display:grid;place-items:center;font-size:14px}
  .p-name{font-weight:800;font-size:12px}.p-handle{font-size:10px;color:var(--mute);font-family:var(--mono)}
  .p-hook{font-weight:800;font-size:13.5px;margin:8px 0 5px;line-height:1.5;text-wrap:balance}
  .p-sub{font-size:11.5px;color:var(--mute);line-height:1.6}
  .p-sub .num{color:var(--champ);font-weight:800;font-family:var(--mono)} .cta{color:var(--rose);font-weight:800}
  .p-foot{display:flex;gap:16px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);
    font-size:12px;font-family:var(--mono);color:var(--mute)}
  .p-foot b{color:var(--ivory)} .p-foot .h{color:var(--rose)}

  /* ---- ticker ---- */
  .ticker{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 14px;background:rgba(10,7,14,.7);border-top:1px solid var(--line)}
  .t-lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--mint);text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:5px}
  .t-lab i{width:5px;height:5px;border-radius:50%;background:var(--mint);box-shadow:0 0 7px var(--mint)}
  .t-log{flex:1;min-width:0;height:15px;position:relative;overflow:hidden}
  .t-log .ln{position:absolute;white-space:nowrap;font-family:var(--mono);font-size:10px;color:var(--mute)}
  .t-log .ln .ts{color:var(--champ)} .t-log .ln .ok{color:var(--mint)}

  @keyframes blink{50%{opacity:.25}}
  @keyframes idle{50%{transform:translateY(-2px)}}
  @keyframes typeA{50%{transform:rotate(20deg)}}
  @keyframes typeB{0%,100%{transform:rotate(18deg)}50%{transform:rotate(2deg)}}
  @keyframes cheerL{50%{transform:rotate(-150deg)}}
  @keyframes cheerR{50%{transform:rotate(150deg)}}
  @keyframes point{50%{transform:rotate(-38deg) translateX(2px)}}
  @keyframes flick{50%{opacity:.6}}
  @keyframes run{0%{left:-52px}88%,100%{left:100%}}
  @keyframes hop{50%{transform:translateY(-3px)}}
  @keyframes swing{50%{transform:rotate(30deg)}}
  @media (prefers-reduced-motion:reduce){#bg{display:none} *{animation:none!important}}
</style>

<div class="stage">
  <canvas id="bg"></canvas>

  <div class="hud">
    <div class="title">
      <div class="t1">深夜のAIカンパニー</div>
      <div class="t2">現役 美容室オーナー &times; AI</div>
    </div>
    <div class="hud-r">
      <span class="live"><i></i>LIVE <span id="clock">--:--:--</span></span>
      <div class="kpis">
        <div class="kpi"><div class="k">意思決定/秒</div><div class="v mint" id="k-dec">0</div></div>
        <div class="kpi"><div class="k">投稿</div><div class="v champ" id="k-post">0</div></div>
      </div>
    </div>
  </div>

  <div class="office">
    <div class="neon"><div class="n1">24H OPERATION</div><div class="n2">SALON &times; AI ROOM</div></div>

    <!-- boss -->
    <div class="boss" id="boss">
      <div class="bubble" id="b-boss">結論から報告してや</div>
      <div class="worker slow" style="--c:var(--rose-deep)">
        <div class="hair"></div><div class="head"></div><div class="body"></div>
        <div class="arm l"></div><div class="arm r"></div>
      </div>
    </div>

    <div class="grid">
      <div class="station" data-dept="0">
        <div class="wk"><div class="bubble">黒字着地や📈</div>
          <div class="worker" style="--c:var(--champ)"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div></div></div>
        <div class="desk"><div class="mon"><div class="glow"></div><div class="barz"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:85%"></i></div></div><div class="slab"></div></div>
        <div class="plate">💰 数字 <small>分析中</small></div>
      </div>
      <div class="station" data-dept="1">
        <div class="wk"><div class="bubble">口コミ返信、送っとくで</div>
          <div class="worker" style="--c:var(--rose)"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div></div></div>
        <div class="desk"><div class="mon"><div class="glow"></div><div class="barz"><i style="height:60%"></i><i style="height:35%"></i><i style="height:80%"></i><i style="height:50%"></i></div></div><div class="slab"></div></div>
        <div class="plate">🎯 集客 <small>実装中</small></div>
      </div>
      <div class="station" data-dept="2">
        <div class="wk"><div class="bubble">このフック刺さる…！</div>
          <div class="worker" style="--c:var(--mint)"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div></div></div>
        <div class="desk"><div class="mon"><div class="glow"></div><div class="barz"><i style="height:75%"></i><i style="height:45%"></i><i style="height:65%"></i><i style="height:90%"></i></div></div><div class="slab"></div></div>
        <div class="plate">✍️ 台本 <small>執筆中</small></div>
      </div>
      <div class="station" data-dept="3">
        <div class="wk"><div class="bubble">顔ブレ検品OK🎬</div>
          <div class="worker" style="--c:var(--coral)"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div></div></div>
        <div class="desk"><div class="mon"><div class="glow"></div><div class="barz"><i style="height:50%"></i><i style="height:88%"></i><i style="height:40%"></i><i style="height:70%"></i></div></div><div class="slab"></div></div>
        <div class="plate">🎨 制作 <small>生成中</small></div>
      </div>
    </div>

    <!-- runner carrying draft to the phone -->
    <div class="runner"><div class="worker"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div></div><span class="doc">📄</span></div>
  </div>

  <div class="phone">
    <div class="p-app"><div class="p-av">✂️</div><div><div class="p-name">AI社長と美容室経営</div><div class="p-handle">@salon_ai_ceo</div></div></div>
    <div class="p-hook" id="p-hook">　</div>
    <div class="p-sub" id="p-sub"></div>
    <div class="p-foot"><span class="h">♥ <b id="likes">0</b></span><span>💬 <b id="cmts">0</b></span><span>🔁 <b id="reps">0</b></span></div>
  </div>

  <div class="ticker"><span class="t-lab"><i></i>意思決定ログ</span><div class="t-log" id="tlog"></div></div>
</div>

<script>
(function(){
  var RM=matchMedia('(prefers-reduced-motion: reduce)').matches, $=function(s){return document.querySelector(s)},$$=function(s){return[].slice.call(document.querySelectorAll(s))};
  function pad(n){return(n<10?'0':'')+n}
  function tick(){var d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
  tick();setInterval(tick,1000);

  var dec=1240,post=1;
  if(!RM)setInterval(function(){dec+=Math.floor(Math.random()*6)+1;$('#k-dec').textContent=dec.toLocaleString();},1300);
  $('#k-dec').textContent=dec.toLocaleString();$('#k-post').textContent=post;

  // monitor bars wiggle
  if(!RM)setInterval(function(){$$('.mon .barz i').forEach(function(b){b.style.height=(20+Math.random()*75)+'%';});},600);

  // department speech bubbles
  var chatter=[
    ['7月、黒字着地や📈','分岐点まであと少し','コスト漏れ発見'],
    ['口コミ返信つくった','周期LINE 配信中📩','失客18名を掘り起こし'],
    ['このフック刺さる…！','3案から勝ち筋を選定','数字は正直に晒す'],
    ['顔ブレ検品OK🎬','無音カット完了','テロップ焼き込み中']
  ];
  var stations=$$('.station');
  function popBubble(st,txt){var b=st.querySelector('.bubble');b.textContent=txt;b.classList.add('show');
    setTimeout(function(){b.classList.remove('show');},2200);}
  var ci=0;
  function chat(){var st=stations[ci%stations.length],arr=chatter[ci%stations.length];
    popBubble(st,arr[Math.floor(Math.random()*arr.length)]);
    // occasional cheer
    if(Math.random()<.3){var w=st.querySelector('.worker');w.classList.add('cheer');setTimeout(function(){w.classList.remove('cheer');},1000);}
    ci++;}
  if(!RM){chat();setInterval(chat,1500);}
  // boss bubble rotate
  var bossLines=['結論から報告してや','数字で見せて','安売りはせん','その値上げ、失客するで'];var bi=0;
  if(!RM)setInterval(function(){bi++;var b=$('#b-boss');b.textContent=bossLines[bi%bossLines.length];b.classList.add('show');setTimeout(function(){b.classList.remove('show');},2400);},3000);
  $('#b-boss').classList.add('show');

  // post content (assembles when runner delivers)
  var hooks=[
    ['深夜2時、AI社長に「その値上げ、失客するで」と止められた話。','7月利益 +19万／口コミ +3／周期LINEで予約 +4。数字ぜんぶ晒します。'],
    ['「髪質改善、次いつ来たら？」を全部AIにまかせた結果。','失客予備軍18名にLINE→予約が戻ってきた。やり方も公開。'],
    ['AIにHPB順位を追わせたら、全部“403”で門前払いされた。','で、結局どうしたか。人力×AIの落としどころを話します。']
  ];
  var hi=0;
  function setPost(){var h=hooks[hi%hooks.length];$('#p-hook').textContent=h[0];
    $('#p-sub').innerHTML='<span class="num">実データ</span>：'+h[1]+'<br><span class="cta">▶ 続きはプロフィールから</span>';}
  setPost();
  function deliver(){hi++;post++;$('#k-post').textContent=post;setPost();
    var av=$('.p-av');av.animate?av.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:500}):0;
    lk+=Math.floor(Math.random()*40)+20;refreshEng();}
  if(!RM)setInterval(deliver,9000); // synced with runner loop (9s)

  // engagement
  var lk=71,cm=3,rp=3;function refreshEng(){$('#likes').textContent=lk;$('#cmts').textContent=cm;$('#reps').textContent=rp;}
  refreshEng();
  if(!RM)setInterval(function(){lk+=Math.floor(Math.random()*5);if(Math.random()<.25)cm++;if(Math.random()<.18)rp++;refreshEng();},1600);

  // ticker (single line fade)
  var logs=[['数字','資金繰りを再計算 → 黒字着地見込み','ok'],['集客','口コミ返信を3件生成（メニュー名入り）','ok'],['集客','失客予備軍18名を抽出 → 周期LINE配信','ok'],['台本','フックを3案比較 → 勝ち筋を採用',''],['制作','キャラ固定で画像4枚生成 → 顔ブレ検品',''],['制作','テロップ焼き込み → 無音区間を自動カット','ok'],['社長','「安売りはしない」で最終承認','']];
  var log=$('#tlog'),ti=0;
  function pushLog(){var d=new Date(),ts=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());var it=logs[ti%logs.length];ti++;
    var ln=document.createElement('div');ln.className='ln';ln.innerHTML='<span class="ts">'+ts+'</span>　['+it[0]+'] '+it[1]+(it[2]?' <span class="ok">✓完了</span>':'');
    ln.style.opacity='0';ln.style.transition='opacity .4s';log.innerHTML='';log.appendChild(ln);requestAnimationFrame(function(){ln.style.opacity='1';});}
  pushLog();if(!RM)setInterval(pushLog,2400);

  // ambient canvas
  var cv=$('#bg'),ctx=cv.getContext('2d'),W,H,pts=[],DP=Math.min(2,devicePixelRatio||1);
  function rs(){W=cv.width=innerWidth*DP;H=cv.height=innerHeight*DP;pts=[];var n=Math.min(48,Math.floor(innerWidth/20));
    for(var i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.1*DP,vy:(Math.random()-.5)*.1*DP,r:(Math.random()*1.4+.4)*DP});}
  rs();addEventListener('resize',rs);
  function draw(){ctx.clearRect(0,0,W,H);for(var i=0;i<pts.length;i++){var p=pts[i];p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    for(var j=i+1;j<pts.length;j++){var q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy,m=(120*DP)*(120*DP);
      if(d<m){ctx.strokeStyle='rgba(230,166,189,'+(.09*(1-d/m))+')';ctx.lineWidth=DP;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}}
    ctx.fillStyle='rgba(236,199,156,.45)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}requestAnimationFrame(draw);}
  if(!RM)draw();
})();
</script>
