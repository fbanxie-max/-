<title>深夜のAIカンパニー — 美容室オーナー×AI</title>
<style>
  :root{
    --void:#140f16; --void2:#0b0710; --line:#3d2f47;
    --ivory:#f6efe9; --mute:#a897a6;
    --rose:#e6a6bd; --rose-deep:#c66f8f; --champ:#ecc79c; --mint:#8fe6c6; --coral:#f0967f;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;
    --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(120% 80% at 50% -6%,#2b1c30,var(--void) 55%,var(--void2));
    color:var(--ivory);font-family:var(--jp);overflow:hidden;display:grid;place-items:center}
  .stage{position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,#150f1c 0 60%, #120c18 100%);box-shadow:0 0 90px rgba(0,0,0,.7)}

  .hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;
    gap:10px;padding:14px 16px 22px;background:linear-gradient(180deg,rgba(10,7,14,.92),rgba(10,7,14,.4) 60%,transparent)}
  .title .t1{font-weight:800;font-size:15px;letter-spacing:.02em}
  .title .t2{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--mint);text-transform:uppercase;margin-top:3px}
  .hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .live{display:inline-flex;align-items:center;gap:5px;color:var(--mint);font-weight:800;font-size:10px;letter-spacing:.14em;font-family:var(--mono)}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 9px var(--mint);animation:blink 1.4s infinite}
  .kpis{display:flex;gap:7px}
  .kpi{background:rgba(38,29,46,.65);border:1px solid var(--line);border-radius:9px;padding:3px 9px;text-align:right;backdrop-filter:blur(4px)}
  .kpi .k{font-size:8px;color:var(--mute);letter-spacing:.08em;font-family:var(--mono);text-transform:uppercase}
  .kpi .v{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
  .v.mint{color:var(--mint)} .v.champ{color:var(--champ)}

  .office{flex:1;min-height:0;position:relative}
  #scene{position:absolute;inset:0;width:100%;height:100%}

  .phone{flex:0 0 auto;margin:0 12px 10px;background:linear-gradient(180deg,rgba(34,26,41,.96),rgba(20,14,26,.96));
    border:1px solid var(--line);border-radius:16px;padding:11px 13px;box-shadow:0 -8px 26px rgba(0,0,0,.5);backdrop-filter:blur(6px);z-index:4}
  .p-app{display:flex;align-items:center;gap:8px}
  .p-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,var(--rose-deep),var(--champ));display:grid;place-items:center;font-size:14px}
  .p-name{font-weight:800;font-size:12px}.p-handle{font-size:10px;color:var(--mute);font-family:var(--mono)}
  .p-hook{font-weight:800;font-size:13.5px;margin:8px 0 5px;line-height:1.5;text-wrap:balance}
  .p-sub{font-size:11.5px;color:var(--mute);line-height:1.6}
  .p-sub .num{color:var(--champ);font-weight:800;font-family:var(--mono)} .cta{color:var(--rose);font-weight:800}
  .p-foot{display:flex;gap:16px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;font-family:var(--mono);color:var(--mute)}
  .p-foot b{color:var(--ivory)} .p-foot .h{color:var(--rose)}

  .ticker{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 14px;background:rgba(9,6,12,.8);border-top:1px solid var(--line);z-index:4}
  .t-lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--mint);text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:5px}
  .t-lab i{width:5px;height:5px;border-radius:50%;background:var(--mint);box-shadow:0 0 7px var(--mint)}
  .t-log{flex:1;min-width:0;height:15px;position:relative;overflow:hidden}
  .t-log .ln{position:absolute;white-space:nowrap;font-family:var(--mono);font-size:10px;color:var(--mute)}
  .t-log .ln .ts{color:var(--champ)} .t-log .ln .ok{color:var(--mint)}
  @keyframes blink{50%{opacity:.25}}
</style>

<div class="stage">
  <div class="hud">
    <div class="title"><div class="t1">深夜のAIカンパニー</div><div class="t2">現役 美容室オーナー &times; AI</div></div>
    <div class="hud-r">
      <span class="live"><i></i>LIVE <span id="clock">--:--:--</span></span>
      <div class="kpis"><div class="kpi"><div class="k">意思決定/秒</div><div class="v mint" id="k-dec">0</div></div><div class="kpi"><div class="k">投稿</div><div class="v champ" id="k-post">0</div></div></div>
    </div>
  </div>

  <div class="office"><canvas id="scene"></canvas></div>

  <div class="phone">
    <div class="p-app"><div class="p-av">✂️</div><div><div class="p-name">AI社長と美容室経営</div><div class="p-handle">@salon_ai_ceo</div></div></div>
    <div class="p-hook" id="p-hook">　</div>
    <div class="p-sub" id="p-sub"></div>
    <div class="p-foot"><span class="h">♥ <b id="likes">0</b></span><span>💬 <b id="cmts">0</b></span><span>🔁 <b id="reps">0</b></span></div>
  </div>

  <div class="ticker"><span class="t-lab"><i></i>意思決定ログ</span><div class="t-log" id="tlog"></div></div>
</div>

<script>
(function(){
  var RM=matchMedia('(prefers-reduced-motion: reduce)').matches, $=function(s){return document.querySelector(s)};
  function pad(n){return(n<10?'0':'')+n}
  function tick(){var d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
  tick();setInterval(tick,1000);
  var dec=1240,post=1;$('#k-dec').textContent=dec.toLocaleString();$('#k-post').textContent=post;
  if(!RM)setInterval(function(){dec+=Math.floor(Math.random()*6)+1;$('#k-dec').textContent=dec.toLocaleString();},1300);

  /* ===== isometric canvas engine ===== */
  var cv=$('#scene'),ctx=cv.getContext('2d'),W,H,DPR=Math.min(2,devicePixelRatio||1),S=1,OX,OY,TW,TH,ZH;
  function shade(hex,f){var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.min(255,r*f)|0;g=Math.min(255,g*f)|0;b=Math.min(255,b*f)|0;return'rgb('+r+','+g+','+b+')';}
  function iso(x,y,z){return[OX+(x-y)*TW, OY+(x+y)*TH - z*ZH];}
  function poly(p,col,line){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();
    ctx.fillStyle=col;ctx.fill();if(line){ctx.strokeStyle=line;ctx.lineWidth=1;ctx.stroke();}}
  // cuboid at tile (x,y), base z, size (w,d,h) in tile units
  function box(x,y,z,w,d,h,hex){
    var t=[iso(x,y,z+h),iso(x+w,y,z+h),iso(x+w,y+d,z+h),iso(x,y+d,z+h)];       // top
    var L=[iso(x,y+d,z+h),iso(x+w,y+d,z+h),iso(x+w,y+d,z),iso(x,y+d,z)];        // front-left (y+d)
    var R=[iso(x+w,y,z+h),iso(x+w,y+d,z+h),iso(x+w,y+d,z),iso(x+w,y,z)];        // front-right (x+w)
    poly(R,shade(hex,.62));poly(L,shade(hex,.82));poly(t,shade(hex,1.18));
  }
  function shadow(x,y,w,d){var c=iso(x+w/2,y+d/2,0);ctx.save();ctx.translate(c[0],c[1]);ctx.scale(1,.5);
    ctx.beginPath();ctx.arc(0,0,(w+d)*TW*.42,0,7);ctx.fillStyle='rgba(0,0,0,.34)';ctx.filter='blur(2px)';ctx.fill();ctx.restore();ctx.filter='none';}

  function monitor(x,y,z,col,phase){ // small screen on desk facing camera (on x+w side)
    var w=.5,h=.42; box(x,y,z,.06,w,h,'#241a2b');
    var s=[iso(x,y,z+h+.02),iso(x,y+w,z+h+.02),iso(x,y+w,z+.06),iso(x,y+.0,z+.06)];
    // screen glow
    var g=iso(x,y+w/2,z+h/2);var rg=ctx.createRadialGradient(g[0],g[1],1,g[0],g[1],26*S);
    rg.addColorStop(0,col);rg.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=.5;ctx.fillStyle=rg;
    ctx.beginPath();ctx.arc(g[0],g[1],26*S,0,7);ctx.fill();ctx.globalAlpha=1;
    poly(s,'#0d0912');
    // bars on screen
    for(var i=0;i<4;i++){var bh=(.08+((Math.sin(phase+i*1.3)+1)/2)*.28);
      var bx=iso(x,y+.08+i*.1,z+.06),bt=iso(x,y+.08+i*.1,z+.06+bh);
      ctx.strokeStyle=col;ctx.lineWidth=3*S;ctx.beginPath();ctx.moveTo(bx[0],bx[1]);ctx.lineTo(bt[0],bt[1]);ctx.stroke();}
  }

  function person(x,y,z,col,t,typing){ // little iso figure
    shadow(x-.16,y-.16,.42,.42);
    var bob=typing?Math.sin(t*9)*.012:Math.sin(t*2)*.006;
    box(x,y,z+bob,.34,.34,.4,col);                 // body
    box(x+.03,y+.03,z+.4+bob,.28,.28,.16,'#e9c9b2'); // head (skin)
    box(x+.02,y+.02,z+.52+bob,.30,.30,.07,'#2a2030'); // hair
    // arms typing
    var a=typing?(Math.sin(t*11)*.05):0;
    box(x-.05,y+.06,z+.24+bob+a,.08,.2,.06,shade(col,.8));
    box(x+.31,y+.06,z+.24+bob-a,.08,.2,.06,shade(col,.8));
  }

  // scene layout (tile coords)
  var stations=[
    {x:0.7,y:1.9,col:'#ecc79c',plate:'💰 数字',bub:['黒字着地や📈','コスト漏れ発見','分岐点まであと少し']},
    {x:2.5,y:1.9,col:'#e6a6bd',plate:'🎯 集客',bub:['口コミ返信つくった','周期LINE 配信中📩','失客18名を掘り起こし']},
    {x:0.7,y:4.3,col:'#8fe6c6',plate:'✍️ 台本',bub:['このフック刺さる…！','3案から勝ち筋','数字は正直に晒す']},
    {x:2.5,y:4.3,col:'#f0967f',plate:'🎨 制作',bub:['顔ブレ検品OK🎬','無音カット完了','テロップ焼き込み中']}
  ];
  var boss={x:1.55,y:.25,col:'#c66f8f'};
  var plants=[{x:-.05,y:.0},{x:3.35,y:.0},{x:-.05,y:6.0},{x:3.35,y:6.0}];

  function drawFloor(){
    // floor tiles
    var NX=4,NY=7;
    for(var gx=0;gx<NX;gx++)for(var gy=0;gy<NY;gy++){
      var p=[iso(gx,gy,0),iso(gx+1,gy,0),iso(gx+1,gy+1,0),iso(gx,gy+1,0)];
      poly(p, (gx+gy)%2? '#221829':'#1c1424', 'rgba(230,166,189,.05)');
    }
    // back walls
    var wc='#181020';
    // left wall (y=0 plane)
    poly([iso(0,0,0),iso(NX,0,0),iso(NX,0,2.1),iso(0,0,2.1)], shade(wc,1.1));
    // right wall (x=0 plane)
    poly([iso(0,0,0),iso(0,NY,0),iso(0,NY,2.1),iso(0,0,2.1)], shade(wc,.7));
    // neon sign on left wall
    var a=iso(.5,0,1.15),b=iso(3.5,0,1.15);
    ctx.save();ctx.translate((a[0]+b[0])/2,(a[1]+b[1])/2);
    ctx.font='700 '+(13*S)+'px '+getComputedStyle(document.body).fontFamily;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(230,166,189,.9)';ctx.shadowBlur=16*S;ctx.fillStyle='#f2b9cc';
    ctx.transform(1,.5,0,1,0,0); // skew to wall plane
    ctx.fillText('SALON × AI  24H',0,0);ctx.restore();ctx.shadowBlur=0;
  }
  function plant(x,y){shadow(x,y,.36,.36);box(x+.06,y+.06,0,.24,.24,.22,'#3a2c42');
    var c=iso(x+.18,y+.18,.22),rg=ctx.createRadialGradient(c[0],c[1]-6*S,1,c[0],c[1]-6*S,16*S);
    rg.addColorStop(0,'#8fe0b0');rg.addColorStop(1,'#3f7a58');ctx.fillStyle=rg;
    ctx.beginPath();ctx.ellipse(c[0],c[1]-10*S,11*S,15*S,0,0,7);ctx.fill();}

  // speech bubbles state
  var bubbles={};
  function drawBubble(x,y,z,text){
    var p=iso(x+.17,y+.17,z+.95),bx=p[0],by=p[1];
    ctx.font='700 '+(11*S)+'px '+getComputedStyle(document.body).fontFamily;
    var w=ctx.measureText(text).width+16*S,h=20*S;
    ctx.fillStyle='#f6efe9';ctx.strokeStyle='rgba(0,0,0,.2)';
    var rx=bx-w/2,ry=by-h,r=8*S;
    ctx.beginPath();ctx.moveTo(rx+r,ry);ctx.arcTo(rx+w,ry,rx+w,ry+h,r);ctx.arcTo(rx+w,ry+h,rx,ry+h,r);
    ctx.arcTo(rx,ry+h,rx,ry,r);ctx.arcTo(rx,ry,rx+w,ry,r);ctx.closePath();
    ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=8*S;ctx.fill();ctx.shadowBlur=0;
    ctx.beginPath();ctx.moveTo(bx-5*S,ry+h);ctx.lineTo(bx+5*S,ry+h);ctx.lineTo(bx,ry+h+6*S);ctx.closePath();ctx.fill();
    ctx.fillStyle='#241a2b';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,bx,ry+h/2);
  }

  // courier path (rectangle around room), returns {x,y}
  function courierPos(t){
    var loop=(t/9)%1; // 9s loop
    var pts=[[1.0,5.6],[3.0,5.6],[3.0,2.7],[1.0,2.7]]; // path corners
    var seg=loop*4,i=Math.floor(seg),f=seg-i,a=pts[i%4],b=pts[(i+1)%4];
    return{x:a[0]+(b[0]-a[0])*f, y:a[1]+(b[1]-a[1])*f};
  }

  function frame(now){
    var t=now/1000;
    ctx.clearRect(0,0,W,H);
    drawFloor();
    // collect depth-sorted actors
    var acts=[];
    plants.forEach(function(p){acts.push({d:p.x+p.y,z:0,f:function(){plant(p.x,p.y);}});});
    stations.forEach(function(st,i){acts.push({d:st.x+st.y,f:function(){
      box(st.x-.1,st.y+.2,0,.75,.55,.32,'#2c2334'); // desk
      monitor(st.x+.62,st.y+.28,.32,st.col,t*3+i); // monitor on desk (x+w side)
      person(st.x,st.y-.05,0,st.col,t+i,true);
    }});});
    acts.push({d:boss.x+boss.y,f:function(){person(boss.x,boss.y,0,boss.col,t*.6,false);}});
    var cp=courierPos(t);
    acts.push({d:cp.x+cp.y,f:function(){person(cp.x,cp.y,0,'#ecc79c',t*3,false);
      var dp=iso(cp.x+.5,cp.y,.55);ctx.font=(15*S)+'px sans-serif';ctx.textAlign='center';
      ctx.shadowColor='rgba(236,199,156,.9)';ctx.shadowBlur=8*S;ctx.fillText('📄',dp[0],dp[1]);ctx.shadowBlur=0;}});
    acts.sort(function(a,b){return a.d-b.d;});
    acts.forEach(function(a){a.f();});
    // bubbles on top
    stations.forEach(function(st){var b=bubbles[st.plate];if(b&&t<b.until)drawBubble(st.x,st.y,0,b.text);});
    var bb=bubbles.boss;if(bb&&t<bb.until)drawBubble(boss.x,boss.y+.1,0,bb.text);
    if(!RM)requestAnimationFrame(frame);
  }
  function resize(){
    var o=$('.office'),w=o.clientWidth,h=o.clientHeight;
    cv.width=w*DPR;cv.height=h*DPR;cv.style.width=w+'px';cv.style.height=h+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);W=w;H=h;
    S=Math.min(w/430,h/560); if(S<.6)S=.6; if(S>1.15)S=1.15;
    TW=38*S;TH=21*S;ZH=34*S;OX=w*0.5+0.4*TW;OY=h*0.30;
    if(RM){requestAnimationFrame(function(){frame(performance.now());});}
  }
  addEventListener('resize',resize);resize();
  if(!RM)requestAnimationFrame(frame);

  // bubble scheduler
  var bi=0;function popB(){var t=performance.now()/1000;
    var st=stations[bi%stations.length];bubbles[st.plate]={text:st.bub[Math.floor(Math.random()*st.bub.length)],until:t+2.4};bi++;}
  if(!RM){popB();setInterval(popB,1500);}
  var bl=['結論から報告してや','数字で見せて','安売りはせん','その値上げ失客するで'],bli=0;
  function popBoss(){var t=performance.now()/1000;bubbles.boss={text:bl[bli%bl.length],until:t+2.6};bli++;}
  if(!RM){popBoss();setInterval(popBoss,3000);}

  /* post + engagement + ticker (DOM) */
  var hooks=[['深夜2時、AI社長に「その値上げ、失客するで」と止められた話。','7月利益 +19万／口コミ +3／周期LINEで予約 +4。数字ぜんぶ晒します。'],
    ['「髪質改善、次いつ来たら？」を全部AIにまかせた結果。','失客予備軍18名にLINE→予約が戻ってきた。やり方も公開。'],
    ['AIにHPB順位を追わせたら、全部“403”で門前払いされた。','で、結局どうしたか。人力×AIの落としどころを話します。']];
  var hi=0;function setPost(){var h=hooks[hi%hooks.length];$('#p-hook').textContent=h[0];
    $('#p-sub').innerHTML='<span class="num">実データ</span>：'+h[1]+'<br><span class="cta">▶ 続きはプロフィールから</span>';}
  setPost();
  var lk=71,cm=3,rp=3;function eng(){$('#likes').textContent=lk;$('#cmts').textContent=cm;$('#reps').textContent=rp;}eng();
  if(!RM){setInterval(function(){lk+=Math.floor(Math.random()*5);if(Math.random()<.25)cm++;if(Math.random()<.18)rp++;eng();},1600);
    setInterval(function(){hi++;post++;$('#k-post').textContent=post;setPost();lk+=Math.floor(Math.random()*40)+20;eng();},9000);}
  var logs=[['数字','資金繰りを再計算 → 黒字着地見込み','ok'],['集客','口コミ返信を3件生成（メニュー名入り）','ok'],['集客','失客予備軍18名を抽出 → 周期LINE配信','ok'],['台本','フックを3案比較 → 勝ち筋を採用',''],['制作','キャラ固定で画像4枚生成 → 顔ブレ検品',''],['制作','テロップ焼き込み → 無音区間を自動カット','ok'],['社長','「安売りはしない」で最終承認','']];
  var log=$('#tlog'),ti=0;function pushLog(){var d=new Date(),ts=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());var it=logs[ti%logs.length];ti++;
    var ln=document.createElement('div');ln.className='ln';ln.innerHTML='<span class="ts">'+ts+'</span>　['+it[0]+'] '+it[1]+(it[2]?' <span class="ok">✓完了</span>':'');
    ln.style.opacity='0';ln.style.transition='opacity .4s';log.innerHTML='';log.appendChild(ln);requestAnimationFrame(function(){ln.style.opacity='1';});}
  pushLog();if(!RM)setInterval(pushLog,2400);
})();
</script>
