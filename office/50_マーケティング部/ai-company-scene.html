<title>AIカンパニー — 美容室オーナー×AI</title>
<style>
  :root{
    --ink:#3a2740; --mute:#8a7385; --line:rgba(90,60,90,.14);
    --pink:#ff6f9c; --coral:#ff8a6b; --sun:#ffc24b; --mint:#22c9a0; --sky:#4bb4ff; --grape:#a06bff;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;
    --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{color:var(--ink);font-family:var(--jp);overflow:hidden;display:grid;place-items:center;
    background:#ffe1c9}
  .stage{position:relative;width:min(100vw, calc(100vh * 9 / 16));height:min(100vh, calc(100vw * 16 / 9));
    display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(165deg,#ffe6b8 0%,#ffcfe0 46%,#c9e9ff 100%);box-shadow:0 0 70px rgba(180,120,150,.4)}

  .hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;
    gap:10px;padding:13px 15px 24px;background:linear-gradient(180deg,rgba(255,255,255,.72),transparent)}
  .title .t1{font-weight:900;font-size:16px;letter-spacing:.01em}
  .title .t2{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--pink);text-transform:uppercase;margin-top:3px;font-weight:700}
  .hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .live{display:inline-flex;align-items:center;gap:5px;color:#e0407a;font-weight:900;font-size:10px;letter-spacing:.12em;font-family:var(--mono)}
  .live i{width:7px;height:7px;border-radius:50%;background:#ff3d7f;box-shadow:0 0 8px #ff8fb4;animation:blink 1.3s infinite}
  .kpis{display:flex;gap:7px}
  .kpi{background:#fff;border:2px solid #fff;border-radius:12px;padding:4px 10px;text-align:right;box-shadow:0 4px 12px rgba(200,120,150,.25)}
  .kpi .k{font-size:8px;color:var(--mute);letter-spacing:.06em;font-family:var(--mono);text-transform:uppercase;font-weight:700}
  .kpi .v{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
  .v.mint{color:var(--mint)} .v.champ{color:#f59e0b}

  .office{flex:1;min-height:0;position:relative}
  #scene{position:absolute;inset:0;width:100%;height:100%}

  .phone{flex:0 0 auto;margin:0 12px 11px;background:#fff;border-radius:20px;padding:12px 14px;
    box-shadow:0 10px 30px rgba(180,110,150,.3);z-index:4}
  .p-app{display:flex;align-items:center;gap:8px}
  .p-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,var(--pink),var(--sun));display:grid;place-items:center;font-size:15px}
  .p-name{font-weight:900;font-size:12.5px}.p-handle{font-size:10px;color:var(--mute);font-family:var(--mono)}
  .p-hook{font-weight:900;font-size:14px;margin:8px 0 5px;line-height:1.5;text-wrap:balance;color:var(--ink)}
  .p-sub{font-size:11.5px;color:var(--mute);line-height:1.6}
  .p-sub .num{color:#e0407a;font-weight:900;font-family:var(--mono)} .cta{color:var(--pink);font-weight:900}
  .p-foot{display:flex;gap:16px;margin-top:9px;padding-top:9px;border-top:2px solid #f4e8ef;font-size:12px;font-family:var(--mono);color:var(--mute);font-weight:700}
  .p-foot b{color:var(--ink)} .p-foot .h{color:var(--pink)}

  .ticker{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(255,255,255,.62);border-top:2px solid rgba(255,255,255,.6);z-index:4;backdrop-filter:blur(4px)}
  .t-lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--mint);text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:5px;font-weight:800}
  .t-lab i{width:5px;height:5px;border-radius:50%;background:var(--mint);box-shadow:0 0 6px #7df0d0}
  .t-log{flex:1;min-width:0;height:15px;position:relative;overflow:hidden}
  .t-log .ln{position:absolute;white-space:nowrap;font-family:var(--mono);font-size:10px;color:var(--mute);font-weight:600}
  .t-log .ln .ts{color:#e0407a} .t-log .ln .ok{color:var(--mint)}
  @keyframes blink{50%{opacity:.3}}
</style>

<div class="stage">
  <div class="hud">
    <div class="title"><div class="t1">AIカンパニー</div><div class="t2">現役 美容室オーナー &times; AI</div></div>
    <div class="hud-r">
      <span class="live"><i></i>LIVE <span id="clock">--:--:--</span></span>
      <div class="kpis"><div class="kpi"><div class="k">意思決定/秒</div><div class="v mint" id="k-dec">0</div></div><div class="kpi"><div class="k">投稿</div><div class="v champ" id="k-post">0</div></div></div>
    </div>
  </div>

  <div class="office"><canvas id="scene"></canvas></div>

  <div class="phone">
    <div class="p-app"><div class="p-av">✂️</div><div><div class="p-name">AI社長と美容室経営</div><div class="p-handle">@salon_ai_ceo</div></div></div>
    <div class="p-hook" id="p-hook">　</div>
    <div class="p-sub" id="p-sub"></div>
    <div class="p-foot"><span class="h">♥ <b id="likes">0</b></span><span>💬 <b id="cmts">0</b></span><span>🔁 <b id="reps">0</b></span></div>
  </div>

  <div class="ticker"><span class="t-lab"><i></i>意思決定ログ</span><div class="t-log" id="tlog"></div></div>
</div>

<script>
(function(){
  var RM=matchMedia('(prefers-reduced-motion: reduce)').matches, $=function(s){return document.querySelector(s)};
  function pad(n){return(n<10?'0':'')+n}
  function tick(){var d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
  tick();setInterval(tick,1000);
  var dec=1240,post=1;$('#k-dec').textContent=dec.toLocaleString();$('#k-post').textContent=post;
  if(!RM)setInterval(function(){dec+=Math.floor(Math.random()*6)+1;$('#k-dec').textContent=dec.toLocaleString();},1300);

  var cv=$('#scene'),ctx=cv.getContext('2d'),W,H,DPR=Math.min(2,devicePixelRatio||1),S=1,OX,OY,TW,TH,ZH;
  function shade(hex,f){var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.min(255,r*f)|0;g=Math.min(255,g*f)|0;b=Math.min(255,b*f)|0;return'rgb('+r+','+g+','+b+')';}
  function iso(x,y,z){return[OX+(x-y)*TW, OY+(x+y)*TH - z*ZH];}
  function poly(p,col,line,lw){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();
    ctx.fillStyle=col;ctx.fill();if(line){ctx.strokeStyle=line;ctx.lineWidth=lw||1;ctx.lineJoin='round';ctx.stroke();}}
  function box(x,y,z,w,d,h,hex,edge){
    var t=[iso(x,y,z+h),iso(x+w,y,z+h),iso(x+w,y+d,z+h),iso(x,y+d,z+h)];
    var L=[iso(x,y+d,z+h),iso(x+w,y+d,z+h),iso(x+w,y+d,z),iso(x,y+d,z)];
    var R=[iso(x+w,y,z+h),iso(x+w,y+d,z+h),iso(x+w,y+d,z),iso(x+w,y,z)];
    poly(R,shade(hex,.78));poly(L,shade(hex,.9));poly(t,shade(hex,1.12), edge?'rgba(255,255,255,.5)':0, 1.4*S);
  }
  function shadow(x,y,w,d){var c=iso(x+w/2,y+d/2,0);ctx.save();ctx.translate(c[0],c[1]);ctx.scale(1,.5);
    ctx.beginPath();ctx.arc(0,0,(w+d)*TW*.4,0,7);ctx.fillStyle='rgba(120,70,110,.16)';ctx.filter='blur(2px)';ctx.fill();ctx.restore();ctx.filter='none';}

  function monitor(x,y,z,col,phase){
    box(x,y,z,.06,.5,.4,'#fff',true);
    var s=[iso(x,y+.05,z+.32),iso(x,y+.45,z+.32),iso(x,y+.45,z+.08),iso(x,y+.05,z+.08)];
    poly(s,'#f3fbff');
    var g=iso(x,y+.25,z+.2),rg=ctx.createRadialGradient(g[0],g[1],1,g[0],g[1],24*S);
    rg.addColorStop(0,col);rg.addColorStop(1,'rgba(255,255,255,0)');ctx.globalAlpha=.35;ctx.fillStyle=rg;
    ctx.beginPath();ctx.arc(g[0],g[1],24*S,0,7);ctx.fill();ctx.globalAlpha=1;
    for(var i=0;i<4;i++){var bh=(.06+((Math.sin(phase+i*1.3)+1)/2)*.2);
      var bx=iso(x,y+.1+i*.09,z+.09),bt=iso(x,y+.1+i*.09,z+.09+bh);
      ctx.strokeStyle=col;ctx.lineWidth=3.4*S;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bx[0],bx[1]);ctx.lineTo(bt[0],bt[1]);ctx.stroke();}
    ctx.lineCap='butt';
  }
  function person(x,y,z,col,hair,t,typing,sit){
    shadow(x-.14,y-.14,.4,.4);
    var bob=typing?Math.sin(t*9)*.012:Math.sin(t*2)*.006, bz=sit?z-.12:z;
    box(x,y,bz+bob,.36,.36,.42,col,true);
    box(x+.04,y+.04,bz+.42+bob,.28,.28,.17,'#ffdcbf',true);
    box(x+.03,y+.03,bz+.55+bob,.30,.30,.08,hair);
    var a=typing?(Math.sin(t*11)*.05):0;
    box(x-.04,y+.07,bz+.26+bob+a,.08,.2,.06,shade(col,.85));
    box(x+.32,y+.07,bz+.26+bob-a,.08,.2,.06,shade(col,.85));
  }

  var stations=[
    {x:0.6,y:2.0,col:'#ffc24b',hair:'#7a4a2a',plate:'💰 数字',bub:['黒字着地や📈','コスト漏れ発見','分岐点まであと少し']},
    {x:2.5,y:2.0,col:'#ff6f9c',hair:'#5a3b52',plate:'🎯 集客',bub:['口コミ返信つくった','周期LINE 配信中📩','失客18名を掘り起こし']},
    {x:0.6,y:4.4,col:'#22c9a0',hair:'#3a3550',plate:'✍️ 台本',bub:['このフック刺さる…！','3案から勝ち筋','数字は正直に晒す']},
    {x:2.5,y:4.4,col:'#4bb4ff',hair:'#6a4a2a',plate:'🎨 制作',bub:['顔ブレ検品OK🎬','無音カット完了','テロップ焼き込み中']}
  ];
  var boss={x:1.55,y:.35,col:'#a06bff',hair:'#3a2a4a'};
  var plants=[{x:-.15,y:-.05},{x:3.35,y:-.05},{x:3.5,y:6.6}];

  function drawFloor(){
    var NX=4,NY=7;
    for(var gx=0;gx<NX;gx++)for(var gy=0;gy<NY;gy++){
      var p=[iso(gx,gy,0),iso(gx+1,gy,0),iso(gx+1,gy+1,0),iso(gx,gy+1,0)];
      poly(p,(gx+gy)%2?'#fff4e9':'#ffe9d6','rgba(255,255,255,.6)',1);
    }
    // colorful rug under desks
    var rg=[iso(0.2,1.4,.01),iso(3.2,1.4,.01),iso(3.2,5.4,.01),iso(0.2,5.4,.01)];
    poly(rg,'rgba(255,160,120,.35)','rgba(255,120,150,.5)',2*S);
    var rg2=[iso(0.6,1.8,.02),iso(2.8,1.8,.02),iso(2.8,5.0,.02),iso(0.6,5.0,.02)];
    poly(rg2,'rgba(120,200,255,.28)',0);
    // walls (light)
    poly([iso(0,0,0),iso(NX,0,0),iso(NX,0,2),iso(0,0,2)],'#ffdff0');
    poly([iso(0,0,0),iso(0,NY,0),iso(0,NY,2),iso(0,0,2)],'#ece0ff');
    // sign
    var a=iso(.5,0,1.1),b=iso(3.5,0,1.1);
    ctx.save();ctx.translate((a[0]+b[0])/2,(a[1]+b[1])/2);
    ctx.font='900 '+(15*S)+'px '+getComputedStyle(document.body).fontFamily;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.transform(1,.5,0,1,0,0);
    ctx.lineWidth=3.5*S;ctx.strokeStyle='#fff';ctx.strokeText('SALON × AI  24H',0,0);
    ctx.fillStyle='#ff5d8f';ctx.fillText('SALON × AI  24H',0,0);ctx.restore();
  }
  function plant(x,y){shadow(x,y,.34,.34);box(x+.06,y+.06,0,.24,.24,.2,'#ff9d6b',true);
    var c=iso(x+.18,y+.18,.2),g=ctx.createRadialGradient(c[0],c[1]-8*S,1,c[0],c[1]-8*S,15*S);
    g.addColorStop(0,'#5fe0a0');g.addColorStop(1,'#2fa870');ctx.fillStyle=g;
    ctx.beginPath();ctx.ellipse(c[0],c[1]-11*S,11*S,15*S,0,0,7);ctx.fill();
    ctx.fillStyle='#7deeb8';ctx.beginPath();ctx.ellipse(c[0]-4*S,c[1]-15*S,5*S,8*S,-.4,0,7);ctx.fill();}
  function mug(x,y,z,col){box(x,y,z,.12,.12,.14,col,true);}

  var bubbles={};
  function drawBubble(x,y,z,text){
    var p=iso(x+.17,y+.17,z+1.0),bx=p[0],by=p[1];
    ctx.font='800 '+(11*S)+'px '+getComputedStyle(document.body).fontFamily;
    var w=ctx.measureText(text).width+16*S,h=21*S,rx=bx-w/2,ry=by-h,r=9*S;
    ctx.beginPath();ctx.moveTo(rx+r,ry);ctx.arcTo(rx+w,ry,rx+w,ry+h,r);ctx.arcTo(rx+w,ry+h,rx,ry+h,r);
    ctx.arcTo(rx,ry+h,rx,ry,r);ctx.arcTo(rx,ry,rx+w,ry,r);ctx.closePath();
    ctx.fillStyle='#fff';ctx.shadowColor='rgba(180,110,150,.4)';ctx.shadowBlur=10*S;ctx.shadowOffsetY=3*S;ctx.fill();
    ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    ctx.beginPath();ctx.moveTo(bx-5*S,ry+h);ctx.lineTo(bx+5*S,ry+h);ctx.lineTo(bx,ry+h+6*S);ctx.closePath();ctx.fill();
    ctx.fillStyle='#3a2740';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,bx,ry+h/2);
  }
  function courierPos(t){var loop=(t/9)%1;var pts=[[1.0,5.6],[3.0,5.6],[3.0,2.7],[1.0,2.7]];
    var seg=loop*4,i=Math.floor(seg),f=seg-i,a=pts[i%4],b=pts[(i+1)%4];return{x:a[0]+(b[0]-a[0])*f,y:a[1]+(b[1]-a[1])*f};}

  // confetti
  var conf=[];function initConf(){conf=[];var cols=['#ff6f9c','#ffc24b','#22c9a0','#4bb4ff','#a06bff','#ff8a6b'];
    for(var i=0;i<26;i++)conf.push({x:Math.random(),y:Math.random(),s:(Math.random()*4+2),c:cols[i%cols.length],r:Math.random()*6,vy:.00006+Math.random()*.00008,vx:(Math.random()-.5)*.00004});}
  function drawConf(){for(var i=0;i<conf.length;i++){var c=conf[i];c.y-=c.vy*16;c.x+=c.vx*16;c.r+=.02;if(c.y<-.05){c.y=1.05;c.x=Math.random();}
    var px=c.x*W,py=c.y*H;ctx.save();ctx.translate(px,py);ctx.rotate(c.r);ctx.globalAlpha=.5;ctx.fillStyle=c.c;
    ctx.fillRect(-c.s*S/2,-c.s*S/2,c.s*S,c.s*S);ctx.restore();}ctx.globalAlpha=1;}

  function frame(now){
    var t=now/1000;ctx.clearRect(0,0,W,H);
    drawConf();
    drawFloor();
    var acts=[];
    plants.forEach(function(p){acts.push({d:p.x+p.y,f:function(){plant(p.x,p.y);}});});
    // couch + chill person front-left
    acts.push({d:0.3+5.6,f:function(){box(0.1,5.3,0,1.0,.5,.32,'#ff9ec2',true);person(0.35,5.45,.2,'#ffd36e','#5a3b52',t*.5,false,true);}});
    stations.forEach(function(st,i){acts.push({d:st.x+st.y,f:function(){
      box(st.x-.1,st.y+.2,0,.75,.55,.32,'#c98a5a',true);
      mug(st.x-.02,st.y+.28,.32,'#ff6f9c');
      monitor(st.x+.62,st.y+.28,.32,st.col,t*3+i);
      person(st.x,st.y-.05,0,st.col,st.hair,t+i,true,false);
    }});});
    acts.push({d:boss.x+boss.y,f:function(){person(boss.x,boss.y,0,boss.col,boss.hair,t*.6,false,false);}});
    var cp=courierPos(t);
    acts.push({d:cp.x+cp.y,f:function(){person(cp.x,cp.y,0,'#ffc24b','#7a4a2a',t*3,false,false);
      var dp=iso(cp.x+.5,cp.y,.55);ctx.font=(15*S)+'px sans-serif';ctx.textAlign='center';ctx.fillText('📄',dp[0],dp[1]);}});
    acts.sort(function(a,b){return a.d-b.d;});acts.forEach(function(a){a.f();});
    stations.forEach(function(st){var b=bubbles[st.plate];if(b&&t<b.until)drawBubble(st.x,st.y,0,b.text);});
    var bb=bubbles.boss;if(bb&&t<bb.until)drawBubble(boss.x,boss.y+.1,0,bb.text);
    if(!RM)requestAnimationFrame(frame);
  }
  function resize(){var o=$('.office'),w=o.clientWidth,h=o.clientHeight;
    cv.width=w*DPR;cv.height=h*DPR;cv.style.width=w+'px';cv.style.height=h+'px';ctx.setTransform(DPR,0,0,DPR,0,0);W=w;H=h;
    S=Math.min(w/430,h/560);if(S<.6)S=.6;if(S>1.2)S=1.2;
    TW=39*S;TH=25*S;ZH=37*S;OX=w*0.5+0.6*TW;OY=h*0.40;initConf();
    if(RM)requestAnimationFrame(function(){frame(performance.now());});}
  addEventListener('resize',resize);resize();
  if(!RM)requestAnimationFrame(frame);

  var bi=0;function popB(){var t=performance.now()/1000;var st=stations[bi%stations.length];
    bubbles[st.plate]={text:st.bub[Math.floor(Math.random()*st.bub.length)],until:t+2.4};bi++;}
  if(!RM){popB();setInterval(popB,1500);}
  var bl=['結論から報告してや','数字で見せて','安売りはせん','その値上げ失客するで'],bli=0;
  function popBoss(){var t=performance.now()/1000;bubbles.boss={text:bl[bli%bl.length],until:t+2.6};bli++;}
  if(!RM){popBoss();setInterval(popBoss,3000);}

  var hooks=[['深夜2時、AI社長に「その値上げ、失客するで」と止められた話。','7月利益 +19万／口コミ +3／周期LINEで予約 +4。数字ぜんぶ晒します。'],
    ['「髪質改善、次いつ来たら？」を全部AIにまかせた結果。','失客予備軍18名にLINE→予約が戻ってきた。やり方も公開。'],
    ['AIにHPB順位を追わせたら、全部“403”で門前払いされた。','で、結局どうしたか。人力×AIの落としどころを話します。']];
  var hi=0;function setPost(){var h=hooks[hi%hooks.length];$('#p-hook').textContent=h[0];
    $('#p-sub').innerHTML='<span class="num">実データ</span>：'+h[1]+'<br><span class="cta">▶ 続きはプロフィールから</span>';}
  setPost();
  var lk=71,cm=3,rp=3;function eng(){$('#likes').textContent=lk;$('#cmts').textContent=cm;$('#reps').textContent=rp;}eng();
  if(!RM){setInterval(function(){lk+=Math.floor(Math.random()*5);if(Math.random()<.25)cm++;if(Math.random()<.18)rp++;eng();},1600);
    setInterval(function(){hi++;post++;$('#k-post').textContent=post;setPost();lk+=Math.floor(Math.random()*40)+20;eng();},9000);}
  var logs=[['数字','資金繰りを再計算 → 黒字着地見込み','ok'],['集客','口コミ返信を3件生成（メニュー名入り）','ok'],['集客','失客予備軍18名を抽出 → 周期LINE配信','ok'],['台本','フックを3案比較 → 勝ち筋を採用',''],['制作','キャラ固定で画像4枚生成 → 顔ブレ検品',''],['制作','テロップ焼き込み → 無音区間を自動カット','ok'],['社長','「安売りはしない」で最終承認','']];
  var log=$('#tlog'),ti=0;function pushLog(){var d=new Date(),ts=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());var it=logs[ti%logs.length];ti++;
    var ln=document.createElement('div');ln.className='ln';ln.innerHTML='<span class="ts">'+ts+'</span>　['+it[0]+'] '+it[1]+(it[2]?' <span class="ok">✓完了</span>':'');
    ln.style.opacity='0';ln.style.transition='opacity .4s';log.innerHTML='';log.appendChild(ln);requestAnimationFrame(function(){ln.style.opacity='1';});}
  pushLog();if(!RM)setInterval(pushLog,2400);
})();
</script>
